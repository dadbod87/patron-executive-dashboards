 state, with writing built off rather than switched off; testing and live are separate applications at separate addresses\u003c/li>\u003cli>\u003cstrong>POCC Web mobile and checklist-responsiveness release shipped to Production (2026-09-05)\u003c/strong> — proven against real behaviour in the testing environment before promotion: rapid taps no longer freeze the list, queued saves complete in order, and a refresh preserves what was confirmed\u003c/li>\u003cli>\u003cstrong>POCC Web brought into agreement with the September operating model for everything John needs — deployed to Sandbox and live-verified (2026-09-04)\u003c/strong> — project budget cards, a governed work queue and tenant-maintenance list that exclude finished work, all three create paths in the browser, and checklist progress; an \u003cstrong>exactly-once safeguard on the financial write was proven live\u003c/strong> by submitting the same transaction twice and getting one record\u003c/li>\u003cli>\u003cstrong>POCC Web Production-readiness prepared in the repository (2026-09-04)\u003c/strong> — Sandbox and Production built as separate, locked interfaces that cannot be mistaken for one another, and a real structural difference between the Sandbox and live workbooks found by read-only inspection and fixed before it could cause a problem. \u003cstrong>Production itself was not touched and cannot yet be written to.\u003c/strong>\u003c/li>\u003cli>\u003cstrong>Slice 3A\u003c/strong> — Lease Termination &amp; Vacancy; \u003cstrong>Executive reporting\u003c/strong> — real Gmail-draft dispatch and the governed rent model\u003c/li>\u003c/ul>\n\u003ch3>Up Next \u003cem>(approved priority order, with Nick's readiness targets)\u003c/em>\u003c/h3>\n\u003col>\u003cli>\u003cstrong>Categorize older expenses by hand\u003c/strong> — in the new review screen; nothing is guessed. \u003cem>(Project balance warnings and the review screen were released and switched on 2026-10-01.)\u003c/em>\u003c/li>\u003cli>\u003cstrong>Report users' own first use\u003c/strong> — each person's own acceptance of the project summary report. \u003cem>(Eric's use and Jess's first use were accepted on 2026-10-01 — Owner Reports; John and Jess joined as Leadership on 2026-09-28 and 2026-09-29.)\u003c/em>\u003c/li>\u003cli>\u003cstrong>Independent security review\u003c/strong> — required before any external-user launch; deferred by Nick for a few weeks on 2026-09-24; findings fixed and retested. The platform is not described as independently reviewed until then.\u003c/li>\u003cli>\u003cstrong>Slack, read-only\u003c/strong> — each person connects their own Slack account; only channels Slack already lets them see; no sending.\u003c/li>\u003cli>\u003cstrong>Known data-gap cleanup\u003c/strong> — properties without a city and similar gaps corrected by people — never guessed.\u003c/li>\u003cli>\u003cstrong>Role-access editor design\u003c/strong> — the fuller per-person access editor that builds on today's access areas; designed, not yet built.\u003c/li>\u003cli>\u003cstrong>Recovery decisions\u003c/strong> — point-in-time recovery for the last seven days is on since 2026-10-01 (Nick's decision; database only); a backup of uploaded files and a restore rehearsal remain decisions for Nick, Jess and the owner.\u003c/li>\u003cli>\u003cstrong>Employee SOPs and handbook (future)\u003c/strong> — role-based standard operating procedures and an employee handbook for learning Patron; recorded as future work, not yet scheduled.\u003c/li>\u003c/ol>\n\u003cblockquote>\u003cp>The earlier Up Next list ended at \u003cem>&quot;Import approved Master Data&quot;\u003c/em>. That step, the administrator bootstrap and the seeded-state restore rehearsal are \u003cstrong>complete\u003c/strong>; the sequence above supersedes it.\u003c/p>\u003c/blockquote>","summary":"Each platform area and its status on the review date."},"status":{"id":"3","title":"Current Platform Status (high level)","html":"\u003cp>\u003cstrong>Now real\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>A governed Production environment\u003c/strong> — a dedicated Production database on the paid \u003cstrong>Pro\u003c/strong> tier (with our hosting also on Pro), \u003cstrong>isolated from our development and staging environments.\u003c/strong>\u003c/li>\u003cli>A Production security model that has been validated \u003cem>in Production\u003c/em>\u003cstrong> — role/capability access controls, row-level security, scoped access, and trusted server-controlled paths all behaved correctly; every test rolled back and left \u003c/strong>no residue.\u003c/li>\u003cli>\u003cstrong>Hardened sign-in and sessions\u003c/strong> — multi-factor authentication, invitation-only access, disabled public/anonymous sign-ups, and 30-day / 7-day session limits.\u003c/li>\u003cli>\u003cstrong>Recovery, three separate facts\u003c/strong> (see §4): the database has \u003cstrong>point-in-time recovery\u003c/strong> for the last seven days (on since 2026-10-01; it replaced the daily backups); \u003cstrong>uploaded files are not in any backup\u003c/strong>; and \u003cstrong>restoring today's Production has not been rehearsed\u003c/strong> — the 2026-08-12 rehearsal restored a backup taken before any real records existed.\u003c/li>\u003cli>\u003cstrong>Security &amp; identity foundation\u003c/strong> — authentication, role-based access, deny-by-default permissions, and an append-only audit trail, built and validated.\u003c/li>\u003cli>\u003cstrong>Governed operational modules in daily use\u003c/strong> — Work Orders and Maintenance (the system of record since 2026-09-23), Dispatch Center (Gmail drafts), projects, bank transactions and reserves, live management reports, role-based workspaces, and the full residential operating chain with real records (onboarding → lease activation → rent obligation → payments → deposits → corrections → termination &amp; vacancy).\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>What's been proven\u003c/strong>\u003c/p>\n\u003cul>\u003cli>Users \u003cstrong>cannot directly reach protected data\u003c/strong> by going around the intended paths; \u003cstrong>scoped access behaves correctly\u003c/strong> (people see only what their role and property scope allow); \u003cstrong>trusted server-controlled paths still work\u003c/strong>; and the tests that prove all this \u003cstrong>ran safely and rolled back\u003c/strong>, so \u003cstrong>Production was left clean.\u003c/strong>\u003c/li>\u003cli>The \u003cstrong>first Master Data onboarding scope\u003c/strong> was approved, its import pathway validated on synthetic data, and the data \u003cstrong>imported to Production and reconciled\u003c/strong>.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>In progress / planned\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Acceptance and the category backlog (current top priority)\u003c/strong> — categorizing older expenses by hand; leadership using their balance alerts; report users' own first use of the Reports page. \u003cem>(John, Jess and Matt have joined; Jess's first use, Eric's use and Nick's refund recording are accepted; rent, deposits, Avah's records, the daily workflow and maintenance are verified and every implemented workflow works — Owner Reports, Nick, 2026-10-02.)\u003c/em>\u003c/li>\u003cli>\u003cstrong>The independent security review\u003c/strong> — required before any external-user launch; deferred by Nick for a few weeks on 2026-09-24.\u003c/li>\u003cli>\u003cstrong>Residential completions\u003c/strong> — move-out and deposit-settlement practice and the Liberty special lease remain.\u003c/li>\u003c/ul>\n\u003cblockquote>\u003cp>The platform is the \u003cstrong>business's operating system of record\u003c/strong> with a \u003cstrong>real, security-proven Production home\u003c/strong> — in daily use by named internal staff since September 22, holding POCC's former work since September 23. \u003cem>(See §4 for exactly what &quot;production-ready&quot; means today.)\u003c/em>\u003c/p>\u003c/blockquote>","summary":"What is real today, what has been proven, and what is in progress."},"vision":{"id":"7","title":"POCC in the Overall Vision","html":"\u003cp>POCC (the Patron Operations Command Center) carried the company's \u003cstrong>operational command system\u003c/strong> — the daily work-order and intake lifecycle, maintenance and vendor dispatch, project budgets and spend, and the reserve and reimbursement cycle — first in the Google Sheet and, from 2026-09-05, through the POCC Web interface.\u003c/p>\n\u003cp>\u003cstrong>On 2026-09-23 that work moved into the Patron Platform.\u003c/strong> Work orders with their checklists, project tracking, bank transactions and the reserve and reimbursement records were imported and reconciled, and \u003cstrong>Patron became the company's single system of record\u003c/strong>. POCC Web shows an archive notice that points people to Patron, and the Sheet is kept as read-only history — nothing in it is changed or deleted. What POCC established (daily review of work with leadership, the approved classification and reserve model, dispatch packages prepared for Gmail) continues inside Patron.\u003c/p>","summary":"How POCC's work moved into Patron on September 23, 2026."},"continuity":{"id":"8","title":"AI Continuity — how development stays consistent and recoverable","html":"\u003cp>The platform is built with a disciplined, auditable development system so progress is never lost and every decision is traceable:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Project Atlas\u003c/strong> — the company's development brain: a version-controlled repository that is the \u003cstrong>durable memory\u003c/strong> for vision, decisions, knowledge, and standards. If it isn't written down, it isn't relied upon.\u003c/li>\u003cli>\u003cstrong>Athena\u003c/strong> — the strategy/product advisor that reasons like an operations manager and prepares decisions for review.\u003c/li>\u003cli>\u003cstrong>Claude Code\u003c/strong> — the engineer that implements against the repository and keeps the memory current. Its main session runs on \u003cstrong>Opus 5.5\u003c/strong>; specialist agents for independent review, verification and bounded implementation run on \u003cstrong>Sonnet\u003c/strong>; and the most capable tier (\u003cstrong>Fable 5.1\u003c/strong>) is used only as a deliberate, one-off escalation. Routing decides which model does the thinking, never what is permitted.\u003c/li>\u003cli>\u003cstrong>GitHub\u003c/strong> — every change is committed with a clear message and reviewable history; work deploys to a protected preview, never straight to production.\u003c/li>\u003cli>\u003cstrong>Documentation &amp; daily closeout\u003c/strong> — each working session updates the living documentation and hands off cleanly, so any session (human or AI) can pick up exactly where the last left off, from the repository — \u003cstrong>not from memory or chat history.\u003c/strong>\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>The Daily Leadership Artifact.\u003c/strong> One output of this workflow is leadership-facing. At the end of each working day, the Atlas/Athena process compiles a short executive summary — what was completed, what's in progress, the risks being watched, and what's planned next. It is a \u003cstrong>continuously maintained leadership briefing\u003c/strong>, not a technical log, so anyone authorized can see the current state of the work at any time without waiting for a separate update.\u003c/p>\n\u003cp>\u003cstrong>Leadership surfaces.\u003c/strong> The Daily Leadership Artifact is published as the \u003cstrong>Executive Operations Brief\u003c/strong> at a stable public address — \u003ca href=\"https://dadbod87.github.io/patron-executive-dashboards/\" rel=\"noopener\">Open Executive Operations Brief ↗\u003c/a> — reviewed and published every workday, verified end to end, and carrying the \u003cstrong>Atlas System Map\u003c/strong>, a curated view of how the operation's systems fit together and who is authoritative for what. The \u003cstrong>Atlas Living Brain\u003c/strong> (\u003ca href=\"https://atlas.thepatrongrp.com/\" rel=\"noopener\">open ↗\u003c/a>) presents the complete canonical system map. Since 2026-10-02 this binder is published inside the Brief; the separate binder page is kept as a superseded record. The Brief and the Brain link to each other, and neither embeds the other.\u003c/p>\n\u003cp>The result: development that is \u003cstrong>consistent, reviewable, and recoverable\u003c/strong> — the same discipline we're applying to the production migration.\u003c/p>","summary":"How development stays consistent, reviewable and recoverable."},"looks":{"id":"1b","title":"What POCC Web actually looks like","html":"\u003cp>\u003cem>Retained for continuity — POCC Web is archived since 2026-09-23 and its work now lives in Patron. Two views of the same screen — at a desk and on a phone. The designed version of this binder shows both images; here they are described.\u003c/em>\u003c/p>\n\u003cp>\u003cstrong>At desk width:\u003c/strong> persistent navigation down the left, the three create actions across the top, and a work queue ordered so that whatever needs a person today sits first. Each work order carries its status as a colour taken from \u003cstrong>the workbook's own rules\u003c/strong>, not from a designer's preference.\u003c/p>\n\u003cp>\u003cstrong>On a phone:\u003c/strong> the same information \u003cstrong>re-laid out rather than shrunk\u003c/strong> — the menu collapses, \u003cem>New\u003c/em> becomes one compact control, and the cards stack into a single column. This is the version John and Eric meet in the field, and it is why &quot;does it work on a phone&quot; was treated as a requirement rather than a nicety.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>Both images use synthetic demonstration data.\u003c/strong> Every property, vendor, work order and date in them is invented, and the preview they come from is not connected to any workbook. \u003cstrong>No screenshot of the real system appears in this binder\u003c/strong> — real operational values are excluded from leadership artifacts by rule.\u003c/p>\u003c/blockquote>\n\u003cblockquote>\u003cp>\u003cstrong>If a phone ever shows the desktop layout\u003c/strong>, the browser has \u003cstrong>&quot;Desktop site&quot;\u003c/strong> switched on. That is exactly what happened once here, and turning the setting off fixed it. A browser setting — not a fault in the software.\u003c/p>\u003c/blockquote>","summary":"What the former POCC Web screens looked like at a desk and on a phone (history)."}},"onboarding":{"overview":{"id":"1","title":"Executive Overview","html":"\u003cp>\u003cstrong>What it is.\u003c/strong> The Patron Platform is The Patron Group's \u003cstrong>unified, employee-facing operating platform\u003c/strong> — one secure website, one login, role-based workspaces, shared data and audit. The design principle beneath it is simple: \u003cstrong>one event, one record, many perspectives\u003c/strong> — information is entered once, then shown through the lens each role needs. It is the software product that Project Atlas builds, and since 2026-09-23 it is the company's system of record — the work that POCC (the Patron Operations Command Center) carried now lives in Patron's operations module.\u003c/p>\n\u003cp>\u003cstrong>Why it exists.\u003c/strong> Patron's operations ran across spreadsheets, a rent tracker, and disconnected tools. Information is duplicated, hard to audit, and dependent on individual people knowing where things live. The platform exists to make the company's operational knowledge \u003cstrong>durable, connected, secure, and reviewable\u003c/strong> — so decisions are faster and nothing falls through the cracks. The work began with budgeting and the day-to-day operational follow-up formerly carried by Riley, and has grown into building that shared operating substrate for the whole company.\u003c/p>\n\u003cp>\u003cstrong>The business problems it solves.\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>One source of truth\u003c/strong> instead of many spreadsheets that drift out of sync.\u003c/li>\u003cli>\u003cstrong>Role-based visibility\u003c/strong> — each person sees exactly what their job needs, no more. One person acts, another oversees, and leadership gains visibility — \u003cstrong>the same records seen through different lenses\u003c/strong>, never separate copies.\u003c/li>\u003cli>\u003cstrong>Built-in accountability\u003c/strong> — every action is recorded; leadership sees status and history without chasing people.\u003c/li>\u003cli>\u003cstrong>Continuity\u003c/strong> — knowledge lives in the system, not in one person's head or one person's file.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Why it replaces spreadsheet-driven workflows.\u003c/strong> Spreadsheets can't enforce permissions, can't reliably audit who changed what, and can't connect a tenant to their lease to their rent to their documents. The platform does — while \u003cstrong>preserving the workflows Avah already knows\u003c/strong> (we are replacing the \u003cem>data substrate\u003c/em>, not retraining people).\u003c/p>\n\u003cp>\u003cstrong>Where this leads.\u003c/strong> The platform turns everyday operations into a durable record — a progression from \u003cstrong>operational history → company memory → better decisions\u003c/strong>. Each meaningful action adds a page to the company's history; reporting then turns that history into insight through a consistent pattern — \u003cstrong>Overview → Narrative → Evidence\u003c/strong> (the figures, then what they mean, then the records any conclusion traces back to). The aim is straightforward: \u003cstrong>better information, better decisions, a better company.\u003c/strong>\u003c/p>","summary":"What Patron is, why it exists, and the problems it solves."},"plan":{"id":"6","title":"Production Onboarding Plan (executive level)","html":"\u003cp>The goal is the \u003cstrong>minimum real data for Avah to work\u003c/strong>, moved in carefully — \u003cem>historical records never delay go-live.\u003c/em>\u003c/p>\n\u003cp>\u003cstrong>Why Avah is first (the strategy).\u003c/strong> We make \u003cstrong>one real operational user genuinely workable first\u003c/strong>, and use that to \u003cstrong>prove the shared real-data foundation\u003c/strong> — persisted properties, units, tenants, leases, rent/payment status, and deposits (including third-party-funded deposits) — end to end. Then we \u003cstrong>reuse that proven foundation to onboard POCC\u003c/strong>, rather than building POCC in parallel. This is \u003cstrong>faster and safer\u003c/strong>: it validates the foundation once, with real operations, before it carries more of the company. John's hope for POCC in \u003cstrong>about a month is an internal target, not a hard deadline\u003c/strong> — and not a reason to bypass any readiness gate; Avah-first is the fastest safe route toward it. The main risk we actively manage is \u003cstrong>scope expansion before the first real user is operational.\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Where it stands (2026-10-02):\u003c/strong> Avah has worked in Production since September 22, POCC moved into Patron on September 23, and Eric joined the same day. Chance accepted on September 25, John on September 28, and Jess and Matt on September 29, each with their own second factor. John's and Matt's first use went well, Jess's first use went well with Nick walking her through, and Eric's use is accepted — each by Nick's report. On October 2 Nick verified rent, deposits, Avah's operational records, the daily workflow and maintenance, and confirmed that every implemented workflow has been tested and works (Owner Reports; not independent tests). Eric's own confirmation of his phone workspace is still open. \u003cstrong>A first guided session is not go-live\u003c/strong> — each person's own acceptance closes it.\u003c/p>\n\u003cul>\u003cli>Phase 1 — Preparation \u003cem>(complete, 2026-09-17).\u003c/em>\u003cstrong> The \u003c/strong>production environment exists\u003cstrong>, its security model is validated, daily backups were active (replaced by point-in-time recovery on 2026-10-01) and the seeded-state restore rehearsal had passed. Before real data: \u003c/strong>the independent security review\u003cstrong>, \u003c/strong>Production email set-up\u003cstrong> (development email is accepted), a \u003c/strong>restore exercise\u003cstrong> into a throwaway copy, \u003c/strong>correcting known data gaps, and the application's Production deployment for employee use. The approved path is guided residential entry from Avah's current files plus a bounded POCC load with dry-run preview and owner resolutions; no general residential importer is planned. \u003cem>Completed with the internal release on 2026-09-17; the independent security review follows it.\u003c/em>\u003c/li>\u003cli>Phase 2 — Operational data \u003cem>(in use since 2026-09-22; POCC's records imported 2026-09-23).\u003c/em>\u003cstrong> Import only what Avah needs to operate — properties, units, current tenants, active leases, current rent, and deposits — \u003c/strong>one dataset at a time, each validated and approved before the next.\u003c/li>\u003cli>Phase 3 — Documents &amp; photos \u003cem>(storage live; a file backup is still a decision).\u003c/em>\u003cstrong> Bring in signed leases, photos, and attachments through \u003c/strong>governed, private storage (a dedicated security step).\u003c/li>\u003cli>\u003cstrong>Phase 4 — History.\u003c/strong> Payment history, past leases, archived tenants, and legacy financials — \u003cstrong>after\u003c/strong> Avah is live.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Every imported record is traceable:\u003c/strong> its source, when it was imported, by whom, its original identifier, its validation status, and any corrections — so the platform is a true system of record, not a one-time copy. \u003cem>(Detail: the Production Onboarding Plan.)\u003c/em>\u003c/p>","summary":"How people and data were brought onto Patron, phase by phase."},"inventory":{"id":"5","title":"Production Data Inventory (summary — full detail in the Workbook)","html":"\u003cp>The platform will ultimately own the company's core operational data. We inventoried every dataset — its current home, its future source of truth, its owner, and its migration order.\u003c/p>\n\u003cp>\u003cstrong>The business domains\u003c/strong> (in onboarding priority): \u003cstrong>Properties · Units · Tenants · Active Leases · Rent · Deposits · Documents\u003c/strong>, then the broader operational domains (\u003cstrong>Maintenance · Vendors · Financial · Reserves · Projects\u003c/strong>), which moved from POCC into Patron on 2026-09-23, plus \u003cstrong>Activity &amp; Audit\u003c/strong> underneath everything.\u003c/p>\n\u003cp>\u003cstrong>How they relate.\u003c/strong> A property contains units; a lease ties a tenant to a unit; rent obligations derive from the lease; payments are recorded against obligations; documents and activity attach throughout.\u003c/p>\n\u003cp>``\u003ccode>mermaid flowchart LR P[Property] --&gt; U[Unit] --&gt; L[Lease] T[Tenant] --&gt; L L --&gt; R[Rent + Deposits] L --&gt; D[Documents] L --&gt; A[Activity + Audit] \u003c/code>``\u003c/p>\n\u003cp>\u003cstrong>Onboarding order\u003c/strong> (each dataset validated and approved before the next): Entities → Properties → Units → Current tenants → Active leases → Current rent → Existing deposits. \u003cstrong>Documents/photos\u003c/strong> follow as a dedicated secure step; \u003cstrong>history\u003c/strong> comes last and never blocks go-live.\u003c/p>\n\u003cp>\u003cstrong>Approved first-pass scope.\u003c/strong> The first Master Data onboarding scope is \u003cstrong>Jess-approved: 12 Entities and 40 Properties\u003c/strong> (of which 21 are residential and 19 are not; none pending review). A small remainder — \u003cstrong>1 entity and 5 supplemental properties — is intentionally deferred to a later pass\u003c/strong> (not deleted; it remains in the reconciliation history). The real source data is kept \u003cstrong>outside the system\u003c/strong> until import, and the import pathway has already been \u003cstrong>validated on synthetic (stand-in) data\u003c/strong>, so the mechanism is proven before any real record moves.\u003c/p>\n\u003cp>\u003cstrong>Source of truth.\u003c/strong> Properties, units, tenants, leases, rent and deposits are \u003cstrong>Patron Platform\u003c/strong> records, and since 2026-09-23 so are maintenance, vendors, financials, reserves and projects; POCC is kept as read-only history. \u003cem>(Full per-domain tables, relationships, validation rules, and open questions: the Production Data Inventory &amp; Migration Workbook.)\u003c/em>\u003c/p>","summary":"The business data Patron holds, how it relates, and the order it was onboarded."},"freshness":{"id":"freshness","title":"Freshness and Evidence","html":"\u003cp>\u003cem>This binder is an executive summary derived from the Project Atlas repository. These dates are kept distinct on purpose: a review is not an update, and neither is a publication.\u003c/em>\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd data-label=\"\">\u003cstrong>Last reviewed\u003c/strong>\u003c/td>\u003ctd data-label=\"\">\u003cstrong>2026-10-05\u003c/strong> (end of day) — Materially updated\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"\">\u003cstrong>Last material content update\u003c/strong>\u003c/td>\u003ctd data-label=\"\">\u003cstrong>2026-10-05 end of day\u003c/strong> (v1.35) — three releases (permanent record-view and export history; single-area access grants, Avah's access shown correctly; the nightly-job watch) and their honest limits. Earlier the same day \u003cstrong>2026-10-05\u003c/strong> (v1.34) — this week's priority (Avah's training and reliability before features); the retention release approved and waiting; the one-area access grant and the uploaded-file backup prepared, not released. Previously \u003cstrong>2026-10-04\u003c/strong> (v1.33) — the historical review released; Nick's decisions on older records, project creation and permanent record-view history.\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"\">\u003cstrong>Last complete freshness review\u003c/strong>\u003c/td>\u003ctd data-label=\"\">\u003cstrong>2026-09-28\u003c/strong> — every section against the repository at \u003ccode>0f8a927\u003c/code> (Production \u003ccode>19d498d\u003c/code>); materiality found in platform build status · production onboarding progress · security posture or validation status · role-based workspace behavior · reporting or leadership-facing outputs · go-live readiness; no change in production readiness · roadmap or sequencing · POCC integration · Atlas/Athena continuity · owner-presentation narrative. Previously \u003cstrong>2026-09-25\u003c/strong> at \u003ccode>a122669\u003c/code> (Production \u003ccode>6ea8858\u003c/code>); materiality found in platform build status · production onboarding progress · security posture or validation status · role-based workspace behavior · reporting or leadership-facing outputs · go-live readiness; no change in production readiness · roadmap or sequencing (order unchanged; RV shipped) · POCC integration · Atlas/Athena continuity · owner-presentation narrative. Previously \u003cstrong>2026-09-24\u003c/strong> at \u003ccode>4b2819e\u003c/code> (Production \u003ccode>9e295c3\u003c/code>); materiality found in platform build status · roadmap or sequencing · security posture or validation status · reporting or leadership-facing outputs · go-live readiness; no change in production readiness · production onboarding progress · role-based workspace behavior · POCC integration · Atlas/Athena continuity · owner-presentation narrative. Previously \u003cstrong>2026-09-23\u003c/strong> at \u003ccode>36f8238\u003c/code> (Production \u003ccode>2c20a32\u003c/code>); materiality found in platform build status · production readiness · production onboarding progress · roadmap or sequencing · security posture or validation status · role-based workspace behavior · reporting or leadership-facing outputs · POCC integration · go-live readiness. Previously \u003cstrong>2026-09-18\u003c/strong> at \u003ccode>c9657ce\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"\">\u003cstrong>Canonical source commit reviewed\u003c/strong>\u003c/td>\u003ctd data-label=\"\">\u003ccode>integration-tmp\u003c/code> at \u003ccode>cb64944\u003c/code> (2026-10-05 end-of-day closeout; product tree equal to Production \u003ccode>main\u003c/code> \u003ccode>259aaa7\u003c/code>). Earlier \u003ccode>ab03840\u003c/code> (2026-10-05 morning; Production \u003ccode>5ff2f10\u003c/code>). Previously \u003ccode>3b880ae\u003c/code> (2026-10-04 closeout).\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"\">\u003cstrong>Previous full-audit interval (historical)\u003c/strong>\u003c/td>\u003ctd data-label=\"\">2026-09-16 (v1.15) → 2026-09-18 (v1.17) · two workdays — \u003cstrong>materiality found in 7 of the 11 categories\u003c/strong> (listed above)\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"\">\u003cstrong>Last verified public publication\u003c/strong>\u003c/td>\u003ctd data-label=\"\">\u003cstrong>2026-10-02\u003c/strong> — v1.32 in the combined Executive Operations Brief (Daily Closeout; public \u003ccode>6e16ede\u003c/code>; read back live, byte-identical). \u003cstrong>2026-10-02\u003c/strong> — v1.31 in the combined Executive Operations Brief (public \u003ccode>21c8c96\u003c/code>; read back live, byte-identical). \u003cstrong>2026-10-02\u003c/strong> — v1.30 in the combined Executive Operations Brief (read back live, byte-identical). \u003cstrong>2026-10-02\u003c/strong> — v1.29, the first edition inside the combined Executive Operations Brief at the main address (Nick's GO; read back live, byte-identical). Earlier, as the separate binder artifact: \u003cstrong>2026-10-01\u003c/strong> — v1.28 (Daily Closeout; read back live). \u003cstrong>2026-10-01\u003c/strong> — v1.27 (checkpoint; read back live). \u003cstrong>2026-10-01\u003c/strong> — v1.26 (Nick's approval; read back live). \u003cstrong>2026-09-24\u003c/strong> — v1.22 (recorded in the closeout's publication record). \u003cstrong>2026-09-23\u003c/strong> — v1.21 (recorded in the closeout's publication record). \u003cstrong>2026-09-22\u003c/strong> — v1.20 as Version 21. \u003cstrong>2026-09-18\u003c/strong> — v1.17 published as artifact Version 18 and read back. \u003cstrong>2026-09-17\u003c/strong> — v1.16 published as artifact Version 17 and read back; share-link pin to Version 17 was pending Nick. \u003cstrong>2026-09-16\u003c/strong> — v1.15 as Version 16. \u003cstrong>2026-09-15\u003c/strong> — v1.14 and v1.13 to the \u003cstrong>same stable artifact URL\u003c/strong>. Before that, v1.10 (2026-09-05); \u003cstrong>v1.11 and v1.12 were never published.\u003c/strong> \u003cstrong>From 2026-09-15 this binder is reviewed and published every workday.\u003c/strong> \u003cem>(Publication is not complete until the live version has been re-read.)\u003c/em>\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"\">\u003cstrong>Separate binder page\u003c/strong>\u003c/td>\u003ctd data-label=\"\">\u003cstrong>Superseded 2026-10-02.\u003c/strong> The former binder artifact (edition v1.28) is kept as a historical record with a notice pointing to the Brief, and receives no further updates.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Nothing in this binder asserts a deployment, publication, or operational status the repository does not evidence.\u003c/strong> Where a capability is built but not deployed, it says so. Where real data is held back by choice, it says so.\u003c/p>","summary":"How review, update and publication dates are kept distinct."}},"redactions":[{"id":"binder-amount-entry-example","reason":"The public safety gate allows only the approved $30 and $480 figures; the example amounts are replaced by a description with the same meaning."}],"intro":{"short":"\u003cp>\u003cstrong>Patron\u003c/strong> is The Patron Group's own secure web application for its property operations, project work and financial tracking — the company's system of record since September 23, 2026. \u003cstrong>Atlas\u003c/strong> is the private workspace where Nick and AI assistants design, build and check Patron; nothing reaches Patron or this page without Nick's approval.\u003c/p>","more":"\u003cp>\u003cstrong>What Patron holds.\u003c/strong> Property operations — tenants, leases and rent, deposits, and maintenance work orders; project work — projects, their funding and their spending; and financial tracking — bank transactions, refunds, reserves and reimbursements. Everyone signs in with a second factor and sees only what their role needs.\u003c/p>\n\u003cp>\u003cstrong>What Atlas does.\u003c/strong> It keeps the company's operating knowledge, every decision and the evidence behind each change, so the work can be reviewed and recovered. This page is prepared by Atlas from those reviewed records.\u003c/p>\n\u003cp>\u003cstrong>How to read this page.\u003c/strong> Each section says what kind of statement it holds: work \u003cstrong>delivered\u003c/strong> and confirmed, a \u003cstrong>release\u003c/strong> to the live system, \u003cstrong>acceptance\u003c/strong> by the people who use it, a \u003cstrong>plan\u003c/strong>, or a \u003cstrong>decision\u003c/strong> still open. A plan is never reported as done, and a release is not called accepted until the people using it say so.\u003c/p>"},"areas":[{"area":"Production Environment","status":"Operational (holds real data)"},{"area":"Identity & Security","status":"Operational"},{"area":"User Workspaces","status":"Operational"},{"area":"Entities","status":"Operational"},{"area":"Properties","status":"Operational"},{"area":"Units","status":"Operational"},{"area":"Tenants","status":"Operational"},{"area":"Leases","status":"Operational"},{"area":"Rent Management","status":"Operational"},{"area":"Deposits","status":"Operational"},{"area":"Documents & Photos","status":"Built"},{"area":"Maintenance","status":"Operational"},{"area":"Transactional email","status":"Operational"},{"area":"POCC Web interface","status":"Archived (read-only history)"},{"area":"September operating model","status":"Operational"},{"area":"Executive Reporting","status":"Operational"},{"area":"Atlas / Athena","status":"Operational"},{"area":"Property Development","status":"Preview"},{"area":"Cash & Entity Funding","status":"Preview"},{"area":"Liberty","status":"Planned"}],"viewSummaries":{"goals":"What remains before everyone works fully in Patron, the initiatives after that, and the decisions waiting on Nick.","platform":"Which parts of Patron are live today, how they fit together, and how the work stays reviewable and recoverable.","onboarding":"For a new owner or leader: what Patron is, how people and data were brought onto it, and what it holds."},"preview":null,"archives":[{"id":"brief-v39","title":"Executive Operations Brief","edition":"v39","date":"2026-10-01","out":"archive/executive-operations-brief-v39-2026-10-01.html","provenance":"Identical to the copy published at the main address on October 1, 2026.","adaptations":["An archive notice is added at the top. The content is otherwise unchanged."]},{"id":"binder-v1.28","title":"Owner Onboarding Binder","edition":"v1.28","date":"2026-10-01","out":"archive/owner-onboarding-binder-v1.28-2026-10-01.html","provenance":"The edition published as the separate binder on October 1, 2026 (artifact Version 27).","adaptations":["An archive notice is added at the top.","A standard page wrapper (document type, character set and phone-width setting) is added; the binder service supplied it before.","One example amount is replaced by approved general wording with the same meaning.","On very narrow phones (360 px and below), two labels may wrap so the page fits the screen; no wording changes."]}]}</script>
<script>
(() => {
  const S = JSON.parse(document.getElementById("site-data").textContent);
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const MONTH = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const fmt = (d) => { if (!d) return ""; const [y, m, day] = d.split("-").map(Number); return day ? `${MON[m - 1]} ${day}, ${y}` : `${MONTH[m - 1]} ${y}`; };
  const LBL = { fact: ["b-fact", "Verified fact"], report: ["b-report", "Stakeholder report"], hyp: ["b-hyp", "Hypothesis"], rec: ["b-rec", "Recommendation"], future: ["b-future", "Future vision"] };
  const CONF = { verified: ["b-fact", "Verified"], estimated: ["b-estimated", "Estimated"], potential: ["b-potential", "Potential"], unknown: ["b-unknown", "Not yet measured"] };
  const STAT = { complete: ["s-complete", "Complete"], progress: ["s-progress", "In progress"], Operational: ["s-op", "Operational"], Archived: ["s-arch", "Archived"], Built: ["s-built", "Built"], "Production Ready": ["s-built", "Production ready"] };
  const badge = (map, k) => map[k] ? `<span class="badge ${map[k][0]}">${map[k][1]}</span>` : "";
  const list = (a) => `<ul class="plain">${(a || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;
  // What kind of statement a section holds — delivered work, a release, user acceptance, a plan, an open decision.
  const KIND = { delivered: "Delivered", release: "Released", acceptance: "Accepted by users", plan: "Plan", decision: "Decision pending", status: "Current status", record: "Reviewed record" };
  const kind = (k) => k ? `<span class="kind k-${k}">${KIND[k]}</span>` : "";
  const block = (title, lead, inner, id, k) => `<div class="block"${id ? ` id="${id}"` : ""}><h3>${esc(title)}${kind(k)}</h3>${lead ? `<p class="lead">${esc(lead)}</p>` : ""}${inner}</div>`;
  const plain = (html) => { const d = document.createElement("div"); d.innerHTML = html; return d.textContent; };
  const chapter = (c, lead, k) => block(c.title, lead, `<div class="card prose">${c.html}</div>`, "ch-" + c.id, k);
  const m = S.meta;
  // The public Atlas Living Brain (canonical visitor address, knowledge/brain/BRAIN_CONTRACT.md); opens in a new tab.
  const BRAIN_URL = "https://atlas.thepatrongrp.com/";
  const brainLink = `<div class="brainlink"><p><strong>The Visual Brain.</strong> Explore how Patron's systems, goals, and decisions connect.</p><a class="btn" href="${BRAIN_URL}" target="_blank" rel="noopener">Explore the Visual Brain <span aria-hidden="true">↗</span><span class="sr">(opens in a new tab)</span></a></div>`;

  $("#sub").textContent = m.sub;
  $("#band").innerHTML = [
    ["Last reviewed", fmt(m.lastReviewed), m.reviewOutcome],
    ["Brief edition", m.version.replace(/\s*\(.*\)/, ""), "Last material update " + fmt(m.lastMaterialUpdate)],
    ["Onboarding binder", m.binderVersion, "Updated " + fmt(m.binderDate)],
    ["Prepared for", "The Patron Group", "Owner: " + m.owner],
  ].map(([k, v, s]) => `<div class="cell"><div class="k">${esc(k)}</div><div class="v">${esc(v)}<small>${esc(s)}</small></div></div>`).join("");
  $("#foot").textContent = `As of ${fmt(m.asOf)} · ${m.version}`;
  if (S.preview) document.querySelector(".band").insertAdjacentHTML("afterend", `<div class="draft" role="note"><div class="wrap"><strong>Preview — not published.</strong> ${esc(S.preview)}</div></div>`);

  const views = [
    ["overview", "Overview", "Patron and Atlas in brief, what is live today, the latest accomplishments, and what comes next.", overview],
    ["progress", "Daily progress", "Every reviewed daily update and dated milestone, grouped by day, newest first. Search or filter by month; open an entry to read it in full.", progress],
    ["goals", "Goals & milestones", S.viewSummaries.goals, goals],
    ["impact", "Impact", "What has changed for the people doing the work — reported and measured separately, never estimated beyond the approved value model.", impact],
    ["platform", "Platform", S.viewSummaries.platform, platform],
    ["onboarding", "Onboarding", S.viewSummaries.onboarding, onboarding],
    ["about", "About & archive", "How this page is prepared, what counts as evidence, and where earlier editions are kept.", about],
  ];
  $("#nav").innerHTML = views.map(([id, name]) => `<li><a href="#${id}" data-view="${id}">${esc(name)}</a></li>`).join("");

  // An expandable section: its title and one-line summary stay visible; the detail opens on demand (keyboard: Tab, Enter).
  const foldRaw = (id, title, summary, inner, k, open) => `<details class="chap" id="${id}"${open ? " open" : ""}><summary><div><h3>${esc(title)}${kind(k)}</h3>${summary ? `<p class="sum">${esc(summary)}</p>` : ""}</div><span class="more" aria-hidden="true"><span class="o">Open</span><span class="c">Close</span></span></summary><div class="prose">${inner}</div></details>`;
  const fold = (c, k, open) => foldRaw("ch-" + c.id, c.title, c.summary, c.html, k, open);
  const h3 = (t, k) => `<h3 class="h">${esc(t)}${kind(k)}</h3>`;
  const more = (href, t) => `<p class="small"><a href="${href}">${esc(t)}</a></p>`;
  const isLive = (a) => /^Operational/.test(a.status);

  function overview() {
    const b = S.overview.brief;
    const rows = [["Where things stand", b.currentState, "status"], ["What changed", b.whatChanged + (b.whatChangedAlso ? "\n\n" + b.whatChangedAlso : ""), "record"], ["Why it matters", b.whyItMatters], ["Risks and limits", b.currentRisks, "status"], ["Next", b.tomorrowFocus, "plan"]].filter(([, v]) => v);
    const live = S.areas.filter(isLive), other = S.areas.filter((a) => !isLive(a));
    const full = `<div class="grid g2">${S.overview.cards.map((c) => `<div class="card stat"><div class="num">${esc(c.num)}</div><div class="lab">${esc(c.label)}</div><p class="sub">${esc(c.sub)}</p></div>`).join("")}</div>
      <dl class="brief" style="margin-top:16px">${rows.map(([k, v, kk]) => `<dt>${esc(k)}${kind(kk)}</dt><dd>${v.split("\n\n").map((p) => `<p>${esc(p)}</p>`).join("")}</dd>`).join("")}</dl>
      <h4>Next actions${kind("plan")}</h4>${list(S.overview.next)}
      <h4>The phase in one paragraph${kind("record")}</h4><p>${esc(m.phase)}</p>`;
    return `<div class="card intro block" id="about-patron-atlas"><h3 class="h">Patron and Atlas in brief</h3><div class="prose">${S.intro.short}</div>
        ${S.intro.more ? `<details class="inline"><summary>More about Patron, Atlas and how to read this page</summary><div class="prose">${S.intro.more}</div></details>` : ""}</div>
      <div class="block">${brainLink}</div>
      <div class="grid g2 block">
        <div class="card">${h3("Live today", "status")}<ul class="tags">${live.map((a) => `<li>${esc(a.area)}</li>`).join("")}</ul>
          <p class="small muted">Not live as a daily tool: ${other.map((a) => `${esc(a.area)} (${esc(a.status.toLowerCase())})`).join(" · ")}.</p>${more("#platform", "Platform, area by area")}</div>
        <div class="card">${h3("Latest accomplishments", "record")}${list(S.overview.today)}${more("#progress", "All daily progress")}</div>
      </div>
      <div class="grid g2 block">
        <div class="card">${h3("Next priorities", "plan")}${list(S.overview.priority)}</div>
        <div class="card">${h3("Decisions waiting", "decision")}${list(S.goals.questions.slice(0, 4))}${more("#goals", "All open decisions")}</div>
      </div>
      ${foldRaw("full-brief", "The full brief", "Highlights, where things stand, what changed, why it matters, risks and the next actions — as recorded at the latest review.", full)}`;
  }

  // Daily progress: the binder's reviewed dated updates + the brief's dated milestones, grouped by day. Each entry keeps
  // its own identity (for example the October 1 checkpoint and the October 1 end-of-day update are separate entries).
  const items = [
    ...S.progress.updates.map((u, i) => ({ kind: "update", date: u.date, label: u.label, html: u.html, text: plain(u.html), i })),
    ...S.progress.milestones.map((x, i) => ({ kind: "milestone", date: x.date, label: "Milestone", text: x.name, i: 1000 + i })),
  ].filter((x) => x.date).sort((a, b) => b.date.localeCompare(a.date) || a.i - b.i);
  const days = []; for (const x of items) { const d = days[days.length - 1]; if (d && d.date === x.date) d.items.push(x); else days.push({ date: x.date, items: [x] }); }
  const months = [...new Set(items.map((x) => x.date.slice(0, 7)))];
  // What distinguishes this entry from the day's others (its own words, without the date the day heading already shows).
  function identity(x) {
    const [, mo, d] = x.date.split("-").map(Number);
    return x.label.replace(/^Current update · /, "current update · ").replace(/\b\d{4}-\d{2}-\d{2}\b,?\s*/g, "")
      .replace(new RegExp(`\\b${MONTH[mo - 1]} ${d}\\b`), "").replace(/\(\s*\)/g, "").replace(/[()]/g, "")
      .replace(/\bthe morning of\b/, "morning").replace(/^the\s+/, "").replace(/\s*·\s*$/, "").replace(/\s+/g, " ").trim();
  }
  function gist(t) { const s = t.replace(/\s+/g, " ").trim(); const cut = s.search(/(?<=[.!?])\s/); return cut > 40 && cut < 260 ? s.slice(0, cut) : s.slice(0, 220) + (s.length > 220 ? "…" : ""); }
  function progress() {
    const entry = (x) => `<details class="entry" data-text="${esc((x.label + " " + x.text).toLowerCase())}"><summary>
        <span class="tag">${x.kind === "update" ? `Daily update${identity(x) ? `<small>${esc(identity(x))}</small>` : ""}` : "Milestone"}</span>
        <span class="gist">${esc(gist(x.text))}</span><span class="more" aria-hidden="true"><span class="o">Read</span><span class="c">Close</span></span></summary>
        <div class="body prose">${x.kind === "update" ? x.html : `<p>${esc(x.text)}</p>`}</div></details>`;
    return `<p class="lead" style="margin:0 0 12px">${kind("record")} Each daily update states in its own words what was <strong>released</strong>, what was <strong>built but not released</strong>, what the people using it <strong>accepted</strong>, and what is <strong>planned</strong>. ${kind("delivered")} Milestones mark delivered turning points.</p>
      <div class="tools"><label class="sr" for="q">Search daily progress</label><input id="q" type="search" placeholder="Search updates and milestones">
        <div class="chips" role="group" aria-label="Filter by month"><button type="button" class="chip" aria-pressed="true" data-m="">All</button>${months.map((mo) => `<button type="button" class="chip" aria-pressed="false" data-m="${mo}">${MONTH[+mo.slice(5) - 1]}</button>`).join("")}</div></div>
      <p class="count" id="count" aria-live="polite"></p>
      <ol class="timeline" id="timeline">${days.map((d) => `<li class="day${d.items.some((x) => x.kind === "update") ? " update" : ""}" data-month="${d.date.slice(0, 7)}">
        <h3 class="when">${esc(fmt(d.date))}<small>${d.items.length > 1 ? `${d.items.length} entries` : "1 entry"}</small></h3>${d.items.map(entry).join("")}</li>`).join("")}</ol>
      ${foldRaw("eras", "How we got here", "The story so far, era by era.", `<div class="grid g2">${S.progress.eras.map((e) => `<div class="card"><div class="eyebrow">${esc(e.period)}</div><h4 style="margin:6px 0 8px">${esc(e.era)}</h4><p class="muted" style="margin:0">${esc(e.text)}</p></div>`).join("")}</div>`)}`;
  }

  function goals() {
    const g = S.goals;
    const miles = `<ul class="plain">${S.progress.milestones.filter((x) => x.mile).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 12).map((x) => `<li><strong>${esc(fmt(x.date))}.</strong> ${esc(gist(x.name))}</li>`).join("")}</ul><p><a href="#progress">Every milestone, in Daily progress</a></p>`;
    return `${block("Decisions waiting", "Each is answered by the person named.", `<div class="card">${list(g.questions)}</div>`, "decisions", "decision")}
      ${block("Remaining work, plans and history", "Open a section to read it in full.",
        fold(g.golive, "status") + fold(g.roadmap, "plan") + fold(g.readiness, "status") +
        foldRaw("milestones", "Key milestones", "The turning points so far, newest first.", miles, "delivered"))}`;
  }

  function impact() {
    const e = S.impact.exec, v = S.impact.value;
    return `${block("How work has changed", e.intro, `<div class="card prose"><p>${esc(e.beforeAfter)}</p></div>`)}
      ${block("Reported by the people doing the work", e.stakeholderFeedback, `<div class="card">${list(e.stakeholderReported)}</div>`, "", "acceptance")}
      ${block("Value created", e.pendingMeasurement, `<div class="grid g3">
        <div class="card"><h4 style="font-size:17px;margin:0 0 10px">Estimated</h4>${v.estimated.map((x) => `<p><strong>${esc(x.workflow)}</strong> ${badge(CONF, x.conf)}<br>${esc(x.est)}<br><span class="muted">${esc(x.validation)}</span></p>`).join("")}</div>
        <div class="card"><h4 style="font-size:17px;margin:0 0 10px">Risk avoided</h4><ul class="plain">${v.riskAvoided.map((x) => `<li>${esc(x.item)} ${badge(LBL, x.label)}</li>`).join("")}</ul></div>
        <div class="card"><h4 style="font-size:17px;margin:0 0 10px">Strategic</h4><ul class="plain">${v.strategic.map((x) => `<li>${esc(x.item)} ${badge(LBL, x.label)}</li>`).join("")}</ul></div></div>`)}
      ${block("Workflow measures", "Before and after, with how sure we are of each.", `<div class="table"><table><thead><tr><th>Workflow</th><th>Before</th><th>After</th><th>How often</th><th>Confidence</th><th>Status</th></tr></thead><tbody>${S.impact.metrics.map((x) => `<tr><td data-label="Workflow"><strong>${esc(x.workflow)}</strong></td><td data-label="Before">${esc(x.before)}</td><td data-label="After">${esc(x.after)}</td><td data-label="How often">${esc(x.freq)}</td><td data-label="Confidence">${badge(CONF, x.conf)}</td><td data-label="Status">${esc(x.status)}</td></tr>`).join("")}</tbody></table></div>`)}
      ${block("What has been delivered", "Each item shows whether it is complete or still in progress, and the evidence behind it.", `<div class="grid g2">${S.impact.deliverables.map((d) => `<div class="card node"><div class="meta">${badge(STAT, d.status)} ${badge(LBL, d.label)}</div><h5>${esc(d.name)}</h5><p>${esc(d.purpose)}</p><p class="owner">${esc(d.type)} · for ${esc(d.audience)}</p></div>`).join("")}</div>`)}
      ${block("What we learned about how the work is done", "", `<div class="grid g2">${S.impact.discoveries.map((d) => `<div class="card node"><div class="meta">${badge(LBL, d.label)}</div><h5>${esc(d.workflow)}</h5><p>${esc(d.detail)}</p><p style="margin-top:8px"><strong>What it means:</strong> ${esc(d.implication)}</p></div>`).join("")}</div>`)}`;
  }

  function platform() {
    const p = S.platform, sys = p.system;
    // Grouped by status as written in the table; a qualifier ("holds real data") stays with its area.
    const byStatus = {};
    for (const a of S.areas) { const q = a.status.match(/^([^(]+?)\s*\((.*)\)$/); const st = q ? q[1] : a.status; (byStatus[st] ??= []).push(q ? `${a.area} (${q[2]})` : a.area); }
    const glance = Object.entries(byStatus).map(([st, names]) => `<div class="glance${st === "Operational" ? " live" : ""}"><div class="k">${esc(st)}</div><ul class="tags">${names.map((n) => `<li>${esc(n)}</li>`).join("")}</ul></div>`).join("");
    const map = sys.tiers.map((t) => `<div class="tier"><h4>${esc(t.label)}</h4><div class="grid g2">${t.nodes.map((n) => `<div class="card node"><div class="meta">${badge(STAT, n.status)}<span class="owner">Authority: ${esc(n.owner)}${n.external ? " · outside the platform" : ""}</span></div><h5>${esc(n.name)}</h5><p>${esc(n.desc)}</p></div>`).join("")}</div></div>`).join("") + `<p class="muted small">Curated from the Atlas system map as of ${esc(fmt(sys.snapshotUpdated))}.</p>`;
    const grew = `<ul class="plain">${sys.growth.map((x) => `<li><strong>${esc(fmt(x.when) || x.when)}.</strong> ${esc(x.what)} ${badge(STAT, x.status)}</li>`).join("")}</ul>`;
    return `${block("Areas at a glance", "As stated in the platform maturity table on the review date.", `<div class="card">${glance}</div>`, "glance", "status")}
      ${block("In detail", "Open a section to read it in full.",
        fold(p.maturity, "status") + foldRaw("system-map", "How the parts fit together", sys.lead, map) +
        foldRaw("growth", "How the platform grew", "Dated platform changes, newest first.", grew, "delivered") +
        fold(p.status, "status") + fold(p.vision) + fold(p.looks) + fold(p.continuity))}`;
  }

  function onboarding() {
    const o = S.onboarding;
    return `${block("Start here", "", fold(o.overview, "", true) + fold(o.plan) + fold(o.inventory) + fold(o.freshness))}`;
  }

  function about() {
    return `${block("Evidence labels", "Every statement on this page comes from a reviewed record. These labels say what kind of evidence stands behind it.", `<div class="card"><ul class="plain">
        <li>${badge(LBL, "fact")} confirmed in the system or its records.</li><li>${badge(LBL, "report")} said by the person who did or saw the work; not independently measured.</li>
        <li>${badge(CONF, "estimated")} an approved estimate, labelled as one. Money and time saved stay "not yet quantified" until a baseline exists.</li>
        <li>${badge(LBL, "hyp")} / ${badge(LBL, "rec")} / ${badge(LBL, "future")} a reasoned expectation, a recommendation or a direction — not yet a result.</li></ul></div>`)}
      ${block("How this page is kept current", "", `<div class="card prose"><p>The page is rebuilt at each workday's closeout from two reviewed sources — the Executive Operations Brief and the Owner Onboarding Binder — so nothing is maintained twice. Publication is a separate, explicitly approved step, and the live copy is read back before it is called current.</p>
        <p>Before publication every build passes the same safety check as before: no personal contact details, identifiers, credentials or account numbers, and no dollar figures other than the two approved value-model inputs.${S.redactions.length ? " Where a source had to be worded differently for this page, the change is listed here:" : ""}</p>
        ${S.redactions.length ? `<ul>${S.redactions.map((r) => `<li>${esc(r.reason)}</li>`).join("")}</ul>` : ""}</div>`)}
      ${block("What each section label means", "", `<div class="card"><ul class="plain">
        <li>${kind("delivered")} work completed and confirmed.</li><li>${kind("release")} changed in the live system, with Nick's approval.</li>
        <li>${kind("acceptance")} confirmed by the people who use it — reported by them, not measured.</li><li>${kind("plan")} intended next; not done.</li>
        <li>${kind("decision")} waiting on the person named.</li><li>${kind("status")} how things stand on the review date.</li>
        <li>${kind("record")} a reviewed record that states each item's status in its own words.</li></ul></div>`)}
      ${block("The Visual Brain", "The complete, interactive map of the operation, kept by the Atlas Living Brain.", brainLink)}
      ${block("Earlier editions", "Nothing is discarded when an edition is replaced. Each archived copy is dated and lists exactly how it was adapted for this public page; the originals are kept unchanged in the Atlas repository.", `<div class="grid g2">${S.archives.map((a) => `<div class="card node"><div class="eyebrow">${esc(fmt(a.date))} · ${esc(a.edition)}</div><h5 style="margin-top:6px"><a href="${esc(a.out)}">${esc(a.title)} ${esc(a.edition)}</a></h5><p>${esc(a.provenance)}</p><p class="muted" style="margin-top:6px">Adapted for public archive: ${a.adaptations.map(esc).join(" ")}</p></div>`).join("")}</div>
        <div class="card prose" style="margin-top:14px"><p>Every published edition of the brief is also kept in the <a href="https://github.com/dadbod87/patron-executive-dashboards/commits/main" rel="noopener">publication history</a>. The binder's dated updates appear in full under <a href="#progress">Daily progress</a>, and its chapters under Goals & milestones, Platform and Onboarding.</p></div>`)}`;
  }

  $("#main").innerHTML = views.map(([id, name, lead, fn]) => `<section class="view" id="view-${id}" aria-labelledby="h-${id}"><div class="view-head"><h2 id="h-${id}">${esc(name)}</h2><p>${esc(lead)}</p></div>${fn()}</section>`).join("");

  // ── View routing and the Daily progress filters ─────────────────────────────────────────────────────────────
  const ids = views.map((v) => v[0]);
  let id = "overview";
  function show() {
    // A view's name selects that view; any other fragment (the skip link's #main) leaves the current view as it is.
    const h = location.hash.slice(1); if (ids.includes(h)) id = h;
    document.querySelectorAll("section.view").forEach((s) => s.classList.toggle("on", s.id === "view-" + id));
    document.querySelectorAll("nav.views a").forEach((a) => a.dataset.view === id ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
    // Keep the active tab visible in the scrolling tab strip without moving keyboard focus or the focus starting point.
    const tab = document.querySelector(`nav.views a[data-view="${id}"]`), strip = tab?.closest("ul");
    if (tab && strip) strip.scrollLeft = Math.max(0, tab.offsetLeft - (strip.clientWidth - tab.offsetWidth) / 2);
    document.title = `${views.find((v) => v[0] === id)[1]} · Executive Operations Brief · The Patron Group`;
  }
  addEventListener("hashchange", () => { if (!ids.includes(location.hash.slice(1))) return; show(); scrollTo(0, 0); });
  show();
  let month = "";
  const q = $("#q");
  function filter() {
    const t = q.value.trim().toLowerCase(); let n = 0, d = 0;
    document.querySelectorAll("#timeline>li").forEach((li) => {
      let k = 0;
      li.querySelectorAll("details.entry").forEach((e) => { const on = (!month || li.dataset.month === month) && (!t || e.dataset.text.includes(t)); e.hidden = !on; k += on; });
      li.hidden = !k; n += k; d += k > 0;
    });
    $("#count").textContent = `${n} of ${items.length} entries · ${d} ${d === 1 ? "day" : "days"}`;
  }
  q.addEventListener("input", filter);
  document.querySelectorAll(".chip[data-m]").forEach((b) => b.addEventListener("click", () => {
    month = b.dataset.m; document.querySelectorAll(".chip[data-m]").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); filter();
  }));
  filter();
})();
</script>
</body>
</html>
