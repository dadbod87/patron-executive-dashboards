or email","date":"2026-07-15","mile":true},{"name":"Repository memory system created","date":"2026-06-28","mile":true},{"name":"Knowledge system & index created","date":"2026-06-28","mile":true},{"name":"Company language glossary created","date":"2026-07-01","mile":true},{"name":"First executive presentation for John & Jess","date":"2026-07","mile":true},{"name":"First multi-source reporting workflow (Zoho + DOPP)","date":"2026-07-02","mile":true},{"name":"First Needs Review exception pattern validated","date":"2026-07-02","mile":true},{"name":"Cross-AI session memory system created","date":"2026-07-02","mile":true},{"name":"Work Impact Artifact Protocol created","date":"2026-07-02","mile":true},{"name":"POCC named as Atlas's primary Application layer","date":"2026-07-06","mile":true},{"name":"POCC Google Sheets prototype activated","date":"2026-07-06","mile":true},{"name":"POCC workbook reaches first v1 modules (Exec Dashboard, KPI Engine, Entity Map, Properties, Bank Transactions Workflow)","date":"2026-07-06","mile":true},{"name":"POCC foundation merged to main (PR #2)","date":"2026-07-06","mile":true},{"name":"POCC workbook simplified to a Work Orders-centric operations workflow","date":"2026-07-06","mile":true},{"name":"POCC Dashboard polished with KPI scorecards and a Priority Work Orders view","date":"2026-07-06","mile":true},{"name":"Work Impact Dashboard visually polished for executive presentation","date":"2026-07-06","mile":true},{"name":"Data model finalized: Bank Transactions = financial events; Projects = future module; budget rollups deferred","date":"2026-07-07","mile":true},{"name":"Dashboard = Executive Attention Management; Operational Alerts Framework; W-9 Payment Hold validated","date":"2026-07-07","mile":true},{"name":"Permanent POCC UI/UX standard adopted; product maturity shift (features → refinement)","date":"2026-07-07","mile":true},{"name":"Sprint 1 (Core Operations Platform) COMPLETE","date":"2026-07-07","mile":true},{"name":"Sprint 1.5 (Executive Experience Polish) COMPLETE → Validation & Real-World Usage","date":"2026-07-07","mile":true},{"name":"Work Impact Baseline Protocol adopted; dashboard redesigned into an evidence-based reporting system (four value categories)","date":"2026-07-07","mile":true},{"name":"Executive publishing pipeline LIVE — dashboard public on GitHub Pages (allowlist + safety scan); publishing folded into the Daily Closeout","date":"2026-07-07","mile":true},{"name":"Reserve Funds Module designed — next major POCC feature (monthly reserve replenishment); Jess/Chance intake 2026-07-08","date":"2026-07-07","mile":true},{"name":"POCC Admin Console v1 — workbook maintenance console; Health Check caught & fixed a real data-integrity issue","date":"2026-07-08","mile":true},{"name":"POCC Projects/Budget module initialized; financial source-of-truth architecture finalized; Funding Source made a first-class field","date":"2026-07-08","mile":true},{"name":"Portfolio Improvement Report reached v1 (complete & stable); COO reviewed both products very positively","date":"2026-07-08","mile":true},{"name":"Future Executive Report Generator approved (gated Admin Console capability)","date":"2026-07-08","mile":true},{"name":"Atlas Milestone #001 — POCC MVP feature-complete → Production Hardening; POCC became an operational finance platform","date":"2026-07-09","mile":true},{"name":"POCC product foundation established — Constitution, documentation hierarchy, Engineering + Implementation Standards, expanded Design Principles","date":"2026-07-09","mile":true},{"name":"Reserve Funds subsystem architecture complete — balance dashboard + visible reimbursement ledger + Dashboard Reserve Fund Health","date":"2026-07-09","mile":true},{"name":"Dashboard Responsibility Model (live state vs. Reports) + Reports = independent Atlas module + Executive Dashboard Design Language","date":"2026-07-09","mile":true},{"name":"Strategic Direction Update (leadership meeting) — production transition scheduled; institutional-knowledge capture prioritized; Atlas → operating system + institutional knowledge platform","date":"2026-07-09","mile":true},{"name":"Production Hardening & Data Integrity Audit + Checkpoint Closeout process + permanent Atlas Milestones log + MVP feature freeze","date":"2026-07-09","mile":true},{"name":"POCC entered a Validation & Quality Assurance stage — maturity shift from building software to preparing production-ready operational software; permanent QA system created (10-phase regression checklist + validation history + bug log; Validation Philosophy)","date":"2026-07-10","mile":true},{"name":"Validation Bug #001 resolved — filter corruption after bulk data population (filter object desync; underlying data valid; recreate the filter over the complete table — now a standard post-import step)","date":"2026-07-10","mile":true},{"name":"Validation Bug #002 resolved — Projects sheet sort integrity; calculated columns re-architected to centralized header-level ARRAYFORMULA (sort-safe, filter-safe, auto-extending). New Engineering Standard #3 + Implementation Standard #4 (preferred workbook pattern) + regression Phase 11","date":"2026-07-10","mile":true},{"name":"🏛️ Reporting Platform Foundation complete (Milestone #002) — Reporting Engine, KPI Engine, Operational Health Engine, Report Generator v1, and Executive Portfolio Report v1, all validated","date":"2026-07-10","mile":true},{"name":"🏛️ Operations Intelligence Engine begun (Milestone #003) → three governed reference implementations: Property Intelligence v1.0, Entity Intelligence v1.0, Vendor Intelligence v1.0","date":"2026-07-10","mile":true},{"name":"🏛️ Operations Intelligence Platform Established (Milestone #004) — Atlas transitioned from a reporting system into a governed Operations Intelligence Platform (Operational Data → Operational Health → Reporting → Operations Intelligence → Presentation → AI); Intelligence First Development adopted","date":"2026-07-10","mile":true},{"name":"First measurable business value — report generation: a comparable six-month operational report went from ~16 hours of manual reconciliation to minutes with the governed platform (initial estimated ~$480 direct-labor per comparable report at $30/hour; one observed baseline, not audited/recurring)","date":"2026-07-10","mile":true},{"name":"🚦 POCC Production Candidate (RC1) — Milestone #005 — the operational workbook crossed from prototype into a production-ready platform; Sprint 1.6 production hardening complete and verified; entered Operational Validation on real Patron Group data","date":"2026-07-13","mile":true},{"name":"RC1 Operational Validation — seven verified refinements. Financial Ownership Model: the duplicate Work Order Financial Health was removed (it risked double-counting) so Projects are the single executive financial source. Property-aware Project selection on Work Orders and Bank Transactions (faster, error-resistant entry; cleaner attribution). Consistent status color language, a three-level work-queue sort, and a Project Name vs. Display Name identity model — with financial reporting repaired and verified unchanged","date":"2026-07-13","mile":true},{"name":"🏛️ Vendor Onboarding Complete (Milestone #006) — all known vendors entered into the POCC vendor database and all available W-9 statuses populated; a governed vendor master that Work Orders and Bank Transactions can reference","date":"2026-07-14","mile":true},{"name":"🏛️ Financial Data Population (Milestone #007) — all July Mercury Bank Transactions entered and classified (entities, projects, reserve-fund classifications); reserve-fund balances current; project approved and remaining budgets populated. POCC advances from structural prototype toward a live operational system; reporting derives from governed operational data","date":"2026-07-14","mile":true},{"name":"Eric work queue validated as a leadership priority (August target); Standard Operational Intake Workflow adopted; Portfolio Report v1 retired as historical; public dashboard value-model figures approved under a narrow allowlist; Property Access Registry governance and tenant-incidental workflow mapping recorded","date":"2026-07-14","mile":true}],"week":["POCC named and documented as Atlas's primary Application layer; foundation merged to main.","Workbook simplified to a Work Orders-centric model, then completed Sprint 1 & Sprint 1.5.","Dashboard reframed as Executive Attention Management; Operational Alerts Framework established (W-9 Payment Hold validated).","Permanent UX standard adopted; product maturity shift (features → refinement).","Data model finalized: Bank Transactions = financial events; Projects = future module; budget rollups deferred."],"month":["Cross-AI session memory system approved and put in place.","Work Impact Artifact Protocol and Claude handoff document established.","Executive reporting prototype: Zoho + historical DOPP budget combined into the Portfolio Improvement Summary, with a Needs Review exception pattern.","POCC adopted; Google Sheets prototype activated."]},"goals":{"roadmap":{"id":"9","title":"Roadmap (remaining major initiatives — no technical detail)","html":"\u003cul>\u003cli>\u003cstrong>Acceptance and training\u003c/strong> — \u003cem>current top priority.\u003c/em> Report users' own first use of the Reports page; Avah's training next week on what is live; leadership using their balance alerts; categorizing older expenses by hand.\u003c/li>\u003cli>\u003cstrong>Older transactions reviewed\u003c/strong> — \u003cem>released 2026-10-04.\u003c/em> Six older records stay as they are by Nick's decision.\u003c/li>\u003cli>\u003cstrong>Project creation\u003c/strong> — built to Nick's decisions (money counts only when it arrives; no budget tracking; Matt may create projects); release pending.\u003c/li>\u003cli>\u003cstrong>Keeping business records permanently\u003c/strong> — decided; the fix that keeps record views and exports is approved and waits for Nick's go-ahead (before late November); recording every export comes next.\u003c/li>\u003cli>\u003cstrong>Backup of uploaded files\u003c/strong> — built and tested with sample files; waits for the company Shared Drive (managed by Nick and Chance).\u003c/li>\u003cli>\u003cstrong>Access one area at a time\u003c/strong> — an administrator can give one person a single area without changing their role (prepared, not released; first use: Monthly Budget Requests for Avah).\u003c/li>\u003cli>Jess's daily workflow \u003cem>(discovery, not a plan)\u003c/em> — learning how Jess organizes her day, tracks progress and repeats work, through Nick's observations, before anything is proposed. \u003cem>(Avah's onboarding, the move of POCC into Patron, and John's, Jess's and Matt's onboarding are complete.)\u003c/em>\u003c/li>\u003cli>\u003cstrong>Independent security review\u003c/strong> — required before any external-user launch; deferred by Nick for a few weeks on 2026-09-24. A reviewer is proposed (John's brother, a software developer), not appointed or scheduled.\u003c/li>\u003cli>Employee SOPs and handbook \u003cem>(future work)\u003c/em> — role-based standard operating procedures and an employee handbook so each person can learn Patron for their role. Recorded, not yet scheduled.\u003c/li>\u003cli>\u003cstrong>Residential completions\u003c/strong> — automatic rent with proration and the multi-payer deposit model are \u003cstrong>in daily use\u003c/strong>; still ahead: move-out and deposit-settlement practice, corrections and exceptions (bounced/reversed payments, late-fee waivers), any late-fee policy, and \u003cstrong>Liberty\u003c/strong> — the special invoice-driven lease.\u003c/li>\u003cli>\u003cstrong>Documents &amp; photos\u003c/strong> — governed private storage is live; a separate backup of uploaded files awaits a decision.\u003c/li>\u003cli>Property-development pro forma \u003cem>(Preview)\u003c/em>\u003cstrong> — a \u003c/strong>simple in-house buy/pass/investigate\u003cstrong> model for quick early decisions on potential deals, \u003c/strong>targeted for January 1. Deliberately lightweight to start.\u003c/li>\u003cli>Property lifecycle \u003cem>(Preview)\u003c/em>\u003cstrong> — a future direction in which a property's full history — acquisition, options, funding, approvals, construction, leasing, operations — lives in one continuous record end to end, supporting \u003c/strong>Dave's\u003cstrong> capital-planning and Property Development decisions. Shown today only as a \u003c/strong>Preview, not a built capability.\u003c/li>\u003cli>Internal communications / inbox \u003cem>(future concept)\u003c/em>\u003cstrong> — record-linked conversations inside the platform, with \u003c/strong>email as a notification, not the system of record. A concept, not yet designed for build.\u003c/li>\u003cli>\u003cstrong>Future integrations\u003c/strong> — the connected-apps direction (Slack, Trello, Drive, Gmail, banking) as each is approved and secured.\u003c/li>\u003cli>\u003cstrong>Broadening\u003c/strong> — additional roles/workspaces and modules as more of the company moves onto the platform.\u003c/li>\u003c/ul>","summary":"The remaining major initiatives, in order."},"golive":{"id":"10","title":"Go-Live Readiness Checklist","html":"\u003cp>\u003cem>The checklist each person's start was measured against. Completed items are kept below as dated history; the work that remains is listed separately from the current records (prepared 2026-10-02).\u003c/em>\u003c/p>\n\u003ch3>Remaining acceptance and readiness work (current)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Report users' own first use\u003c/strong> of the Reports page (released 2026-10-02).\u003c/li>\u003cli>\u003cstrong>Leadership using their balance alerts\u003c/strong>, and \u003cstrong>categorizing older expenses\u003c/strong> by hand.\u003c/li>\u003cli>\u003cstrong>Project creation in Patron\u003c/strong> — the process is decided (Dave approves; Nick, John, Jess or Chance creates the project and records its approved budget, Owner Decision 2026-10-02); all four can record funding, but Patron cannot yet create the project.\u003c/li>\u003cli>\u003cstrong>Recovery:\u003c/strong> decide the uploaded-file backup (built, held) and rehearse restoring today's Production.\u003c/li>\u003cli>\u003cstrong>The independent security review\u003c/strong> — required before any external-user launch; deferred by Nick for a few weeks.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Awaiting confirmation.\u003c/strong> Each stays open until confirmed; none is assumed complete, and none blocks publishing this brief.\u003c/p>\n\u003cul>\u003cli>Eric's own confirmation of his workspace on his phone — \u003cem>awaiting confirmation\u003c/em> (his use is accepted, Owner Report 2026-10-01)\u003c/li>\u003c/ul>\n\u003cp>Related evidence: Jess approved the first Master Data scope (12 entities, 40 properties) and it was imported and reconciled; units were imported 2026-08-14.\u003c/p>\n\u003ch3>Completed (history)\u003c/h3>\n\u003cp>\u003cstrong>Environment\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cspan class=\"check done\" aria-hidden=\"true\">\u003c/span>Production environment confirmed \u003cem>(dedicated Production database on Pro, isolated from Dev/Staging; identity verified before writes)\u003c/em>\u003c/li>\u003cli>\u003cspan class=\"check done\" aria-hidden=\"true\">\u003c/span>Setup backup and restore proven \u003cem>(the \u003cstrong>seeded-state restore rehearsal passed on 2026-08-12\u003c/strong>, before any business records existed; today's recovery and its open items are in §4)\u003c/em>\u003c/li>\u003cli>\u003cspan class=\"check done\" aria-hidden=\"true\">\u003c/span>Required migrations applied \u003cem>(0001→0010 at that time; local == live)\u003c/em>\u003c/li>\u003cli>\u003cspan class=\"check done\" aria-hidden=\"true\">\u003c/span>Security validation complete \u003cem>(full access-control/security suite passed \u003cstrong>in Production\u003c/strong>, every test rolled back — no residue; external security review still precedes launch)\u003c/em>\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Data\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cspan class=\"check done\" aria-hidden=\"true\">\u003c/span>Properties imported \u003cem>(full approved set; none held)\u003c/em>\u003c/li>\u003cli>\u003cspan class=\"check done\" aria-hidden=\"true\">\u003c/span>Units imported \u003cem>(2026-08-14)\u003c/em>\u003c/li>\u003cli>\u003cspan class=\"check done\" aria-hidden=\"true\">\u003c/span>Tenants entered \u003cem>(by Avah, from 2026-09-22)\u003c/em>\u003c/li>\u003cli>\u003cspan class=\"check done\" aria-hidden=\"true\">\u003c/span>Active leases entered \u003cem>(from 2026-09-22)\u003c/em>\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Operations\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cspan class=\"check done\" aria-hidden=\"true\">\u003c/span>Reporting verified \u003cem>(live reports checked against Production records, 2026-09-23)\u003c/em>\u003c/li>\u003cli>\u003cspan class=\"check done\" aria-hidden=\"true\">\u003c/span>Audit logging verified \u003cem>(every governed change read back with its audit record)\u003c/em>\u003c/li>\u003cli>\u003cspan class=\"check done\" aria-hidden=\"true\">\u003c/span>Daily workflow verified \u003cem>(Owner Report, Nick, 2026-10-02)\u003c/em>\u003c/li>\u003cli>\u003cspan class=\"check done\" aria-hidden=\"true\">\u003c/span>Maintenance verified \u003cem>(Owner Report, Nick, 2026-10-02)\u003c/em>\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Validation\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cspan class=\"check done\" aria-hidden=\"true\">\u003c/span>Rent verified \u003cem>(Owner Report, Nick, 2026-10-02)\u003c/em>\u003c/li>\u003cli>\u003cspan class=\"check done\" aria-hidden=\"true\">\u003c/span>Deposits verified \u003cem>(Owner Report, Nick, 2026-10-02)\u003c/em>\u003c/li>\u003cli>\u003cspan class=\"check done\" aria-hidden=\"true\">\u003c/span>Avah's operational records validated \u003cem>(Owner Report, Nick, 2026-10-02)\u003c/em>\u003c/li>\u003cli>\u003cspan class=\"check done\" aria-hidden=\"true\">\u003c/span>Every implemented workflow tested and working \u003cem>(Owner Report, Nick, 2026-10-02 — Nick's confirmation of what is built; not an independently run test, and not a statement about future or unbuilt features)\u003c/em>\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Go Live\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cspan class=\"check done\" aria-hidden=\"true\">\u003c/span>Production approved \u003cem>(internal release, 2026-09-17)\u003c/em>\u003c/li>\u003cli>\u003cspan class=\"check done\" aria-hidden=\"true\">\u003c/span>Avah begins daily operations \u003cem>(2026-09-22)\u003c/em>\u003c/li>\u003cli>\u003cspan class=\"check done\" aria-hidden=\"true\">\u003c/span>Legacy spreadsheets transition to reference-only status \u003cem>(POCC Web and the Google Sheet archived, 2026-09-23)\u003c/em>\u003c/li>\u003cli>\u003cspan class=\"check done\" aria-hidden=\"true\">\u003c/span>John and Jess begin as Leadership \u003cem>(John accepted 2026-09-28, Jess 2026-09-29, each with their own second factor)\u003c/em>\u003c/li>\u003cli>\u003cspan class=\"check done\" aria-hidden=\"true\">\u003c/span>Recording refunds accepted by Nick \u003cem>(Owner Report, 2026-10-02 — he recorded real past refunds; any other person's own use is recorded separately when it happens)\u003c/em>\u003c/li>\u003c/ul>","summary":"Remaining acceptance work, items awaiting confirmation, and the completed checklist kept as history."},"readiness":{"id":"4","title":"Production Readiness","html":"\u003cp>The platform was built \u003cstrong>security-first\u003c/strong>, not as a prototype with security added later.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Authentication\u003c/strong> — invitation-only sign-in with universal multi-factor authentication; sessions are revocable.\u003c/li>\u003cli>\u003cstrong>Role-based workspaces\u003c/strong> — six roles with narrowly-scoped capabilities; each person's workspace shows only what their role and property scope permit. \u003cem>Frontend hiding is never the security boundary\u003c/em> — access is enforced by the server and the database.\u003c/li>\u003cli>\u003cstrong>Governed data model\u003c/strong> — every record has one owner and one source of truth; figures are \u003cstrong>derived\u003c/strong>, never duplicated into competing totals; corrections are \u003cstrong>append-only\u003c/strong>, never destructive rewrites.\u003c/li>\u003cli>\u003cstrong>Audit logging\u003c/strong> — an append-only audit trail records who did what, when; it cannot be edited or deleted.\u003c/li>\u003cli>\u003cstrong>Data governance\u003c/strong> — sensitive information (tenant PII, financial detail, credentials) is protected by policy and never stored where it doesn't belong.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Current implementation status.\u003c/strong> The identity, security, and audit foundation is now live-validated \u003cem>in Production\u003c/em>\u003cstrong> — on a dedicated Production database, isolated from Dev/Staging, with the authorization model seeded and the full access-control suite passed and rolled back (no residue). \u003c/strong>Auth/session controls are hardened\u003cstrong> (30-day/7-day limits, MFA, invitation-only, public/anonymous sign-ups disabled, email confirmation on), and the database has \u003c/strong>point-in-time recovery\u003cstrong> (since 2026-10-01). \u003c/strong>Real business records are in Production:\u003cstrong> tenants, leases, rent and deposits since 2026-09-22, and POCC's work orders, projects and transactions since 2026-09-23. An \u003c/strong>independent security review follows the internal release (Nick's decision, 2026-09-17): deferred by Nick for a few weeks on 2026-09-24, it is still required before any external-user launch.\u003c/p>\n\u003cp>\u003cstrong>Recovery — what has and has not been proven, kept separate.\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Setup restore rehearsal (2026-08-12, passed).\u003c/strong> A backup taken when Production held only its setup (structure and access model, no business records) was restored into a separate scratch project and came back intact. It proved the restore mechanism; it was \u003cstrong>not\u003c/strong> a rehearsal of today's Production.\u003c/li>\u003cli>\u003cstrong>Release rehearsal on a restored copy (2026-09-17).\u003c/strong> That morning's backup of Production — its real master data (entities, properties, units), before residential records arrived on 2026-09-22 — was restored into a temporary project; the release was applied and checked there, and the copy was deleted.\u003c/li>\u003cli>\u003cstrong>Database point-in-time recovery (on since 2026-10-01, Owner Decision).\u003c/strong> Seven days of recovery points, logged about every two minutes; the window began at enablement and reaches seven days around October 8. It replaced the separate daily backups. Up to about two minutes of changes could be lost.\u003c/li>\u003cli>\u003cstrong>Uploaded files (not covered).\u003c/strong> Signed-lease PDFs and receipts in storage are in \u003cstrong>no backup\u003c/strong>; a nightly file backup is built but held, awaiting Nick, Jess and the owner.\u003c/li>\u003cli>\u003cstrong>Restoring today's Production (not rehearsed).\u003c/strong> No restore of Production with its real records has been rehearsed; it remains open in the internal security assessment.\u003c/li>\u003c/ul>","summary":"How the platform was built security-first, and what recovery has and has not proven."},"questions":["Retention: the wording staff see is approved; Nick's go-ahead releases it before late November, when the earliest record-view history would otherwise be deleted.","Monthly Budget Requests for one person: release the change that lets an administrator grant that single area? Until then Avah can request it and Nick can approve it.","File backup: who sets up the company Shared Drive and the Google account it needs? Then a test with sample files before anything real is copied.","Recovery: rehearse restoring a copy of the database somewhere temporary (a small cost) — Nick's decision.","Independent security review: John's brother, a software developer, is the proposed reviewer — not appointed or scheduled. Required before any external-user launch."]},"impact":{"exec":{"intro":"POCC and its Work Order Dispatch Center — whose work moved into Patron on 2026-09-23 — measurably changed how The Patron Group operates day to day; the reports below were given while POCC was in use. To keep this dashboard credible, impact is reported in two clearly separated ways: what stakeholders have observed and reported, and what remains to be formally measured. No dollar amounts or hours-saved figures are estimated.","beforeAfter":"Before POCC + Dispatch Center, John pieced operational status together from scratch paper, whiteboards, emails, phone calls, personal memory, and verbal conversations — often asking a since-departed team member (Riley) what was outstanding and where work stood. Information was fragmented across systems (Zoho had stopped serving the business well), finding work meant searching multiple places, and work orders were communicated mostly verbally — causing repeated interruptions, missed scope, duplicate effort, and inconsistent field communication, with operational knowledge concentrated in one person. Today that information is centralized in POCC: John can immediately see outstanding work, status, priorities, and follow-up dates, manage work from one place, and dispatch a professional Work Order Package in seconds. Operational knowledge is now documented and shared across multiple employees rather than living in one person's memory.","stakeholderReported":["Significant reduction in the time and effort to prepare and dispatch work — John reports building and sending multiple work orders in well under a minute (about 30 seconds), versus manually writing Word documents and communicating task lists verbally.","Centralized operational visibility — outstanding work, status, priorities, and follow-up dates are all in one place (POCC), eliminating searches across scratch paper, whiteboards, emails, and memory.","Verbal task-list communication largely eliminated — Dispatch Center produces clear, written Scopes of Work, greatly reducing missed scope, misunderstandings, and duplicate effort.","Improved consistency between office and field, and improved work quality through standardized Work Order Packages.","Reduced dependence on one individual's institutional knowledge — the system is now understood by multiple employees; the company no longer depends on one person's memory to understand operational status.","Easier onboarding and knowledge sharing — workflows are documented instead of existing primarily in one person's head; improved transparency across the organization.","Better operational continuity — Zoho reported by stakeholders as fully replaced for this workflow (previously it was no longer serving the business well).","Faster operational decision-making and increased organizational efficiency.","Operational rollout (2026-07-28): multiple employees report operations are running more smoothly and have expressed satisfaction with the new system — real-world adoption is producing positive qualitative feedback.","Faster financial documentation (Chance, accounting): bank transactions now include transaction notes/details and receipts almost immediately, rather than requiring waits of weeks — improving accounting visibility and the speed of financial documentation.","Riley transition completed successfully — operational continuity preserved; the operational knowledge Riley held is now documented in POCC and shared across multiple employees, reducing key-person dependency (recorded as a successful milestone, not merely closed administratively)."],"stakeholderFeedback":"John stated the Dispatch Center dramatically improves his workflow, that he loves the system, and that it is a significant improvement over previous methods — previously he had to verbally communicate work orders and task lists, which frequently caused misunderstandings or missed work; the written Scopes of Work now dramatically improve communication quality. John and Jess also expressed that they see Nick's long-term role evolving beyond individual improvements into a Systems Designer for The Patron Group. (Executive vision only, not active roadmap work.)","pendingMeasurement":"No time-saved, hours, or dollar figures are claimed for these improvements yet — they are stakeholder-reported and workflow-analysis based. Formal before/after baselines (e.g. work-order preparation and dispatch time) remain to be captured before any quantified savings are reported. See the Workflow Baseline Metrics below (baselines not yet captured) and the Value Created categories, where Verified Savings remain empty until measured."},"value":{"verified":[],"estimated":[{"workflow":"Report generation (governed Executive Portfolio Report)","est":"≈ $480 per comparable report (≈16 h × $30/h) — INITIAL estimate from one observed baseline; not audited/recurring","conf":"estimated","validation":"Record the next several real report runs (baseline vs. actual generation+review time, corrections, stakeholders, full-replacement?); replace the provisional 16 h with an evidence-based average, then promote to Verified. Do not auto-apply $480 to every report."},{"workflow":"Budget remaining lookup (John)","est":"Baseline capture scheduled","conf":"potential","validation":"Time the ask-Riley loop vs. the self-serve POCC view on real data."}],"riskAvoided":[{"item":"Reduced dependence on one person's memory (Stakeholder-Reported, 2026-07-24) — operational status now lives in POCC and is understood by multiple employees; the company no longer relies on asking one individual what is outstanding.","label":"report"},{"item":"Reduced miscommunication (Stakeholder-Reported, 2026-07-24) — Dispatch Center replaces verbal task lists with written Scopes of Work, cutting missed scope, duplicate effort, and office↔field inconsistency.","label":"report"},{"item":"Riley's budget & exception knowledge captured before her July 17 departure — reduced key-person dependency.","label":"report"},{"item":"Executive visibility improved — one place to see completed work, deliverables, discoveries, milestones, and open questions.","label":"fact"},{"item":"Documentation preserved — durable, reviewable company memory instead of knowledge living in chat history or one person's head.","label":"fact"},{"item":"Standardized processes — the Operational Alerts Framework and a permanent UX standard keep POCC consistent as it grows.","label":"fact"},{"item":"Reduced onboarding effort — a boot sequence, glossary, and knowledge index let a new person (or AI) get productive quickly.","label":"fact"}],"strategic":[{"item":"Operational transformation via Dispatch Center V1 (Stakeholder-Reported, 2026-07-24) — John reports dispatching a professional Work Order Package in seconds and calls it a significant improvement he 'loves'; centralized visibility, standardized communication, and documented workflows replace scattered notes, memory, and verbal hand-offs.","label":"report"},{"item":"Nick's role evolving toward Systems Designer for The Patron Group (Stakeholder Guidance — John & Jess, 2026-07-24) — beyond individual improvements toward department-specific systems that eventually connect into one unified Patron platform. Executive vision only.","label":"report"},{"item":"Faster executive decisions — leadership sees what needs attention today at a glance, instead of digging through data.","label":"fact"},{"item":"One trusted source of operational truth — information is entered once and stays consistent everywhere it's used.","label":"fact"},{"item":"Reporting leadership can rely on — clean, consistent numbers, with ambiguous items flagged for review rather than guessed.","label":"report"},{"item":"Foundation for future operational capabilities — a structure ready to connect day-to-day operations with financial oversight as needs grow.","label":"rec"},{"item":"Built to scale with the business — a durable, documented system instead of fragile one-off spreadsheets.","label":"rec"}]},"metrics":[{"workflow":"Report generation (Exec Portfolio Report)","before":"≈16 h (one observed 6-month report)","after":"seconds–minutes","freq":"Per report","conf":"estimated","evidence":"Nick-provided baseline + $30/h rate","status":"Estimated — awaiting real-run average"},{"workflow":"Budget reconciliation","before":"Not yet measured","after":"Not yet measured","freq":"Monthly","conf":"potential","evidence":"Baseline needed","status":"Baseline needed"},{"workflow":"Work order lookup","before":"Not yet measured","after":"Not yet measured","freq":"To confirm","conf":"unknown","evidence":"Baseline needed","status":"Baseline needed"},{"workflow":"Vendor payment research","before":"Not yet measured","after":"Not yet measured","freq":"To confirm","conf":"unknown","evidence":"Baseline needed","status":"Baseline needed"},{"workflow":"Property status requests","before":"Not yet measured","after":"Not yet measured","freq":"To confirm","conf":"unknown","evidence":"Baseline needed","status":"Baseline needed"},{"workflow":"Executive portfolio review","before":"Not yet measured","after":"Not yet measured","freq":"To confirm","conf":"unknown","evidence":"Baseline needed","status":"Baseline needed"},{"workflow":"Invoice investigation","before":"Not yet measured","after":"Not yet measured","freq":"To confirm","conf":"unknown","evidence":"Baseline needed","status":"Baseline needed"},{"workflow":"Budget remaining lookup","before":"Not yet measured","after":"Not yet measured","freq":"To confirm","conf":"unknown","evidence":"Baseline needed","status":"Baseline needed"}],"deliverables":[{"name":"Patron Platform in Production","type":"Platform","audience":"All employees","purpose":"The company's own secure operating platform, released for internal office use on 2026-09-17 and the system of record since 2026-09-23","status":"complete","label":"fact"},{"name":"Project balance warnings","type":"Patron feature","audience":"Leadership","purpose":"Alerts leadership when a project runs low or is overdrawn, measured from each funding cycle's starting balance (2026-10-01)","status":"complete","label":"fact"},{"name":"Recording refunds","type":"Patron feature","audience":"Finance","purpose":"Money back on an expense stays with its project or entity and carries forward as credit (2026-10-02); Nick's own use accepted","status":"complete","label":"fact"},{"name":"Reports page with printable reports","type":"Patron feature","audience":"Leadership and finance","purpose":"Project Spending and Custom Bank Transactions reports in Excel and PDF, matching the database (2026-10-02)","status":"complete","label":"fact"},{"name":"Combined Executive Operations Brief","type":"Leadership surface","audience":"Leadership","purpose":"One page for the brief and the onboarding binder at the main address, rebuilt from reviewed sources and verified live (2026-10-02)","status":"complete","label":"fact"},{"name":"Atlas repository & memory system","type":"Repository","audience":"Atlas / all AI tools","purpose":"Durable, reviewable company memory (vision, governance, decisions, roadmap, knowledge system)","status":"complete","label":"fact"},{"name":"Company language glossary","type":"Repository","audience":"Cross-system","purpose":"Canonical vocabulary to translate between people, Zoho, and QuickBooks","status":"complete","label":"fact"},{"name":"Cross-AI session memory system","type":"Repository","audience":"Atlas / all AI tools","purpose":"Shared working memory so tools continue without re-explaining context","status":"complete","label":"fact"},{"name":"Work Impact Artifact Protocol","type":"Repository","audience":"Leadership (via artifact)","purpose":"Rules for building this dashboard without inventing value","status":"complete","label":"fact"},{"name":"Executive presentation for John & Jess","type":"Presentation","audience":"John, Jess","purpose":"Explain Atlas as operational strategy, not an AI project","status":"complete","label":"report"},{"name":"Presenter guide","type":"Guide","audience":"Nick","purpose":"Explain Atlas without overselling technology","status":"complete","label":"report"},{"name":"Portfolio Improvement Summary workbook","type":"Report","audience":"Jess (review)","purpose":"First executive reporting prototype from combined Zoho + historical budget data","status":"complete","label":"report"},{"name":"Combined Data reporting model","type":"Data model","audience":"Reporting layer","purpose":"Normalize raw exports into an executive-ready layer","status":"complete","label":"report"},{"name":"Needs Review exception workflow","type":"Pattern","audience":"Reporting layer","purpose":"Isolate ambiguous records instead of guessing them into reports","status":"complete","label":"fact"},{"name":"Gemini prompt system (Sheets)","type":"Prompts","audience":"Nick / Sheets","purpose":"Repeatable spreadsheet consolidation, audit, and formatting","status":"complete","label":"report"},{"name":"POCC subsystem catalog","type":"Architecture","audience":"Atlas","purpose":"Name and organize Atlas's primary Application layer and its subsystems","status":"complete","label":"fact"},{"name":"POCC Google Sheets workbook (Sprint 1 & 1.5)","type":"Application","audience":"John / Leadership","purpose":"Working executive-operations app: Dashboard (attention management), Today's Work Queue, Operational Health Engine, Executive Brief, Work Orders, Bank Transactions, operational alerts","status":"complete","label":"report"},{"name":"POCC UI/UX Guidelines","type":"Architecture","audience":"Atlas / POCC","purpose":"Permanent UX standard every future enhancement is evaluated against","status":"complete","label":"fact"},{"name":"Operational Alerts Framework","type":"Architecture","audience":"Atlas / POCC","purpose":"Reusable standard to surface operational blockers (W-9 hold is the first validated alert)","status":"complete","label":"fact"},{"name":"Work Impact Baseline Protocol","type":"Methodology","audience":"Atlas / Leadership","purpose":"Official measurement methodology: how workflow time becomes defensible, evidence-labeled impact","status":"complete","label":"fact"},{"name":"Executive publishing pipeline (public Pages)","type":"Infrastructure","audience":"Leadership","purpose":"Two-repo, allowlisted, safety-scanned publish of the dashboard to a permanent public URL; automatic in the daily closeout","status":"complete","label":"fact"},{"name":"Reserve Funds Module — design (realized in Patron)","type":"Architecture","audience":"POCC / Jess","purpose":"Next major POCC feature: auditable monthly reserve replenishment (Bank Transactions = source of truth; derived Outstanding; append-only log)","status":"progress","label":"report"},{"name":"Work Order Dispatch Center V1 (Milestone #013)","type":"Application","audience":"John / Vendors","purpose":"Guided in-POCC workflow that builds and sends a professional, branded Work Order Package to vendors (Entity → Property → select work orders → build package → review → Gmail draft → send); replaces the manual Word→email process. Gmail owns recipients; POCC stores no vendor emails.","status":"complete","label":"report"},{"name":"Patron Platform Foundation v1.0","type":"Application","audience":"All staff (future) / Leadership","purpose":"The unified operating system's visual + technical foundation: cohesive product identity + design system, desktop + responsive mobile login, security baseline, documented architecture, and verified recovery tooling","status":"complete","label":"fact"},{"name":"Responsive mobile login (art direction)","type":"Application","audience":"All staff (future)","purpose":"Dedicated portrait login composition + corrected brand hierarchy + optimized responsive image delivery; validated across phone sizes and desktop","status":"complete","label":"fact"},{"name":"Security baseline + production-security plan","type":"Security","audience":"Leadership / engineering","purpose":"0 known dependency vulnerabilities · conservative security headers · demo-auth contained to development; a production authentication/authorization plan (Supabase Auth · server sessions · RLS · deny-by-default) held as a pre-production gate","status":"complete","label":"fact"},{"name":"Foundation Recovery Snapshot v1.0 + tooling","type":"Infrastructure","audience":"Nick / continuity","purpose":"A verified, secret-free offline recovery package (git bundle + clean source + branding + docs + checksums) and a repeatable generator script; validated by extraction, manual inspection, and git-bundle restore; copied to an external drive","status":"complete","label":"fact"}],"discoveries":[{"workflow":"John's daily operations","label":"report","detail":"John's follow-up work is largely reactive; his day can swing from little to do to ~60 vendor/status calls. He finds Zoho confusing and asks Riley for remaining budget before proceeding.","implication":"A simple daily view of budget, work, and follow-ups could create value quickly."},{"workflow":"Riley's budget & exception work","label":"hyp","detail":"Riley appears to manage exceptions, reminders, follow-ups, and budget-impacting details for John rather than full projects. She works mostly in Zoho Analytics and leaves July 17.","implication":"Capturing her workflow now is a time-sensitive risk-reduction priority; the first prototype may be exception + budget aware."},{"workflow":"Zoho ↔ QuickBooks reconciliation","label":"report","detail":"Project names, IDs, categories, and imported records do not align cleanly between Zoho and QuickBooks, creating manual monthly reconciliation work.","implication":"Atlas may add value first as a connection and presentation layer, not a replacement."},{"workflow":"Bank transaction classification","label":"report","detail":"Chance clarified that the workflow does not need named accounting fields yet — only Project Expense / Non-Project Expense / Unsure. Nick will classify each transaction by purpose and project link.","implication":"Keep classification minimal now; Bank Transactions becomes the reconciliation hub."},{"workflow":"Vendor compliance (W-9 before payment)","label":"report","detail":"Chance's guidance: a vendor should not be paid until a completed W-9 is received; today the process relies too heavily on memory, and vendor compliance should become part of POCC.","implication":"Now the first validated Operational Alert — Needs Payment + no W-9 → Missing W-9 Payment Hold (flag, KPI, Today's Work Queue, leadership visibility). Computed visibility, not external automation."},{"workflow":"Multi-entity structure","label":"fact","detail":"The company operates through related holding, development, property, and operating entities plus partners and special-purpose vehicles (captured in sanitized form).","implication":"Atlas must model entity relationships, not a flat company; sensitive ownership detail stays out of the repo."},{"workflow":"Executive reporting","label":"fact","detail":"A February DOPP record (Tenant Incidentals) lacked mapping context and was isolated in a Needs Review tab rather than forced into the report.","implication":"Reports should be built from a normalized layer; ambiguous records get reviewed, not guessed."},{"workflow":"Field capture from properties","label":"future","detail":"John expressed interest in capturing photos and notes at properties and sending them back to the office as follow-up tasks.","implication":"Candidate future subsystem (Field Capture); not a committed build."},{"workflow":"Future maintenance role","label":"report","detail":"The company may hire an in-house maintenance employee for small recurring property work now sent to outside vendors.","implication":"Atlas should eventually route work among internal maintenance, vendors, and staff while preserving history."}]},"platform":{"system":{"sync":{"verified":false,"layers":3,"of":5},"snapshotUpdated":"2026-09-24","sourceCommit":"4d2ff79","lead":"How the parts of the operation fit together, how mature each one is, and who is authoritative for what. Curated from the Atlas canonical system map — the full map lives in the Atlas Living Brain.","tiers":[{"id":"authority","label":"Authority & Governance","nodes":[{"id":"project-atlas","name":"Project Atlas","status":"Operational","owner":"Atlas","desc":"The version-controlled repository that is the durable, authoritative memory. When the repository and anyone's recollection disagree, the repository wins."},{"id":"data-governance","name":"Data Governance","status":"Operational","owner":"Atlas","desc":"What may enter the repository at all. Credentials, personal information and private financial detail are excluded by rule."},{"id":"publication-authority","name":"Publication Authority","status":"Operational","owner":"Owner","desc":"Publishing any public artifact is a separate, explicitly granted act. Generating a leadership surface is never the same as publishing it."},{"id":"deployment-boundary","name":"Deployment Boundary","status":"Operational","owner":"Owner","desc":"Trunk, production and the live operating workbook change only by explicit human authorization."}]},{"id":"operating","label":"Operating Systems","nodes":[{"id":"september-model","name":"September Operating Model","status":"Operational","owner":"Owner","desc":"The approved classification, reserve and reimbursement model effective from September, running in the Patron Platform since 2026-09-23. History is preserved, never rewritten."},{"id":"knowledge-system","name":"Company Knowledge System","status":"Operational","owner":"Atlas","desc":"Structured operating knowledge about how the business actually works, kept separate from the record of what was built."},{"id":"daily-closeout","name":"Daily Closeout","status":"Operational","owner":"Atlas","desc":"The end-of-day procedure that promotes the day's work into durable memory and verifies the leadership surfaces end to end."},{"id":"accounting-system","name":"Accounting System of Record","status":"Operational","owner":"Accounting","external":true,"desc":"The company's accounting system remains authoritative for financial records. Reconciliation against it is deliberately performed by people."}]},{"id":"surfaces","label":"Product Surfaces","nodes":[{"id":"pocc","name":"Operations Command Center","status":"Archived","owner":"Operations","desc":"Carried work orders, maintenance, vendors, transactions and reporting until 2026-09-23, when its records moved into the Patron Platform. Kept as read-only history."},{"id":"pocc-web","name":"POCC Web Interface","status":"Archived","owner":"Atlas","desc":"The browser interface over the command center, live from 2026-09-05; since 2026-09-23 it shows an archive notice pointing people to the Patron Platform."},{"id":"patron-platform","name":"Patron Platform","status":"Operational","owner":"Atlas","desc":"The employee-facing operating platform: one secure sign-in, role-based workspaces, shared records. The company's system of record since 2026-09-23, in daily use by named internal staff for residential, operations and field work. No tenant or customer access."},{"id":"executive-dashboard","name":"Executive Operations Brief","status":"Operational","owner":"Atlas","desc":"This document — the leadership-facing progress surface, published to a stable address and verified at every closeout."}]}],"edges":[{"from":"data-governance","to":"project-atlas","kind":"governs"},{"from":"publication-authority","to":"executive-dashboard","kind":"governs"},{"from":"deployment-boundary","to":"pocc-web","kind":"governs"},{"from":"deployment-boundary","to":"patron-platform","kind":"governs"},{"from":"september-model","to":"pocc","kind":"authoritative for"},{"from":"september-model","to":"pocc-web","kind":"authoritative for"},{"from":"daily-closeout","to":"executive-dashboard","kind":"feeds"},{"from":"knowledge-system","to":"patron-platform","kind":"feeds"},{"from":"pocc","to":"accounting-system","kind":"reconciled against"},{"from":"pocc-web","to":"pocc","kind":"module of"}],"growth":[{"when":"2026-10-02","what":"Four releases: recording refunds, expenses that keep the entity they were recorded with, a W-9 report that never shows a false all-clear, and a Reports page with printable reports; Nick's own refund recording accepted","status":"Operational"},{"when":"2026-10-01","what":"Project balance warnings released and switched on — five projects healthy, three overdrawn projects alerting leadership — with a fast review for older expense categories; Jess's and Eric's use accepted","status":"Operational"},{"when":"2026-09-29","what":"Seven releases: access-request notifications, Matt's workspace, one current lease page per unit, expense categories required on new expenses and the one-page project summary report; Jess and Matt onboarded","status":"Operational"},{"when":"2026-09-25","what":"Fourteen releases: phone-first work, finance lists past 1,000 rows, an audited activity view with a 60-day usage record, a sharper app icon and Chance's workspace; Chance invited by Nick","status":"Operational"},{"when":"2026-09-28","what":"Five releases: the Security page, clearer work-order creation, Responsible at creation and the Monthly Budget Request with a branded one-page PDF; Chance and John signed in","status":"Operational"},{"when":"2026-09-24","what":"Bank Transactions easier to read and filter — rows named by vendor or memo, compact filters with removable chips, short dates, a one-click classification copy; three releases, amounts and records unchanged","status":"Operational"},{"when":"2026-09-24","what":"The Patron Group's new public website live at thepatrongrp.com, designed by Nick with final language and feedback from Chance, who approved it; the old site kept for rollback, email and the employee app untouched","status":"Operational"},{"when":"2026-09-22","what":"Avah onboarded and using Patron daily; first real residential records entered; same-day releases from her real use, including an app install option in Settings for iPhone and Android","status":"Production Ready"},{"when":"2026-09-21","what":"Personal workspaces, access requests and signed lease files released to Production; tenant maintenance request page and phone line live; Avah's start rehearsed"},{"when":"2026-09-18","what":"Next release prepared and tested on the development platform — personal workspaces, employee access requests, sessions ended on deactivation, one shared definition of access; not yet approved","status":"Built"},{"when":"2026-09-18","what":"Per-person access areas released to Production — administrators choose which of seven areas each person reaches, enforced by the database; company records unchanged","status":"Production Ready"},{"when":"2026-09-17","what":"Patron Platform released to Production for internal office use by named employees (no tenant or customer access; no real residential records yet)","status":"Production Ready"},{"when":"2026-09-16","what":"Payments and transactional email accepted by Nick on the development database; residential-first access control built there with its final browser test pending (development-only, not in use)","status":"Built"},{"when":"2026-09-15","what":"Corrections a residential move-over needs first — payment reversal and lease start-date correction — built and browser-verified on the development database, lease correction accepted, payment acceptance open (development-only, not in use)","status":"Built"},{"when":"2026-09-14","what":"Launch readiness on the development database: offboarding by deactivation and phone installation accepted by Nick; transactional email built, not yet connected (development-only, not in use)","status":"Built"},{"when":"2026-09-06","what":"Patron Platform operating foundation persisted on the development database — parity data, residential, rent ledger, dispatch packages (development-only, not in use)","status":"Built"},{"when":"2026-09-05","what":"POCC Web live in Production and saving to the real workbook","status":"Operational"},{"when":"2026-09-02","what":"September operating model live in both workbooks","status":"Operational"},{"when":"2026-09-02","what":"POCC Web parity — first two slices landed on the working branch (not deployed at the time; superseded 2026-09-05)","status":"Operational"},{"when":"2026-08-14","what":"Production master data onboarded","status":"Operational"},{"when":"2026-08-10","what":"Governed agent loop live-proven","status":"Operational"}]},"maturity":{"id":"2","title":"Patron Platform Maturity Dashboard","html":"\u003cp>\u003cem>The 30-second view — where the Patron Platform stands today. This is the binder's \u003cstrong>primary living page\u003c/strong>: as the current initiative completes, it advances to the next, while the rest of the binder stays comparatively stable.\u003c/em>\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Platform area\u003c/th>\u003cth>Status\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd data-label=\"Platform area\">\u003cstrong>Production Environment\u003c/strong>\u003c/td>\u003ctd data-label=\"Status\">\u003cstrong>Operational (holds real data)\u003c/strong>\u003c/td>\u003ctd data-label=\"Notes\">A dedicated Production database on the paid Pro tier, isolated from Dev/Staging; migrations + security model validated \u003cem>in Production\u003c/em>; auth/session hardened; \u003cstrong>database point-in-time recovery (seven days) on since 2026-10-01\u003c/strong>, replacing the daily backups; the \u003cstrong>setup restore rehearsal passed\u003c/strong> on 2026-08-12, before any business records; uploaded files are \u003cstrong>not backed up\u003c/strong> (the backup is ready and waits for a company Shared Drive) and restoring today's Production is \u003cstrong>not rehearsed\u003c/strong> (see §4); \u003cstrong>since 2026-10-05 the two nightly jobs are watched\u003c/strong> — a stall becomes a critical alert on System Health and in the bell (no automatic e-mail yet; the watch cannot see its own scheduler stop). \u003cstrong>Master Data is imported and reconciled\u003c/strong>, and Production is \u003cstrong>hard-locked to live data only\u003c/strong> — no synthetic fallback.\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"Platform area\">\u003cstrong>Identity &amp; Security\u003c/strong>\u003c/td>\u003ctd data-label=\"Status\">\u003cstrong>Operational\u003c/strong>\u003c/td>\u003ctd data-label=\"Notes\">Real login, MFA, deny-by-default role access, and an append-only audit trail — \u003cstrong>now live-validated in Production\u003c/strong>. Invitation-only; public and anonymous sign-ups disabled. The independent security review follows the internal release (required; deferred by Nick for a few weeks on 2026-09-24). \u003cstrong>Released to Production (2026-09-17):\u003c/strong> a departing person's account is deactivated, never deleted; \u003cstrong>residential-first access\u003c/strong> — operational access held back by the server until an administrator turns it on with two-factor sign-in, a reason and an audit record; and the database itself requires the second factor. \u003cstrong>Access areas (Production, 2026-09-18):\u003c/strong> an administrator chooses which of seven areas each person reaches, never beyond their role, enforced by the database; \u003cstrong>since 2026-10-05\u003c/strong> an administrator can also grant one area outside a person's role, with a reason, revocable, the role unchanged. \u003cstrong>Released since (2026-09-21 to 2026-09-23):\u003c/strong> access requests with administrator decisions and automatic expiry, sessions ended on deactivation, one shared definition of access, and role-scoped field access (a Field Lead updates only the work assigned to them) alongside a full-access Leadership role. \u003cstrong>Released 2026-09-25:\u003c/strong> administrators can review one person's activity — their audit trail permanently, and pages and records opened for 60 days — and every review is itself recorded.\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"Platform area\">\u003cstrong>User Workspaces\u003c/strong>\u003c/td>\u003ctd data-label=\"Status\">\u003cstrong>Operational\u003c/strong>\u003c/td>\u003ctd data-label=\"Notes\">Role workspaces for John, Jess, Avah, Christy, Eric — \u003cem>one event, one record, many perspectives.\u003c/em> Each person lands on their own home workspace, showing real records filtered to what they are responsible for; \u003cstrong>Avah and Eric use theirs daily\u003c/strong> (Eric's shows his assigned work first and keeps completed jobs in a closed section). Jess's workspace is a live financial overview, and Chance's (released 2026-09-25) is the same overview under his name. John's workspace is phone-first. Each person can arrange their menu within its categories, saved to their account. \u003cstrong>Patron installs on a phone\u003c/strong> as an online-only app (Android one tap; iPhone through Share → Add to Home Screen).\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"Platform area\">\u003cstrong>Entities\u003c/strong>\u003c/td>\u003ctd data-label=\"Status\">\u003cstrong>Operational\u003c/strong>\u003c/td>\u003ctd data-label=\"Notes\">Organizations imported and reconciled into the Production master-data foundation through the governed, permission-checked path. \u003cstrong>Visible on the live screens\u003c/strong> — the 2026-08-12 read-visibility issue was resolved on 2026-08-13.\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"Platform area\">\u003cstrong>Properties\u003c/strong>\u003c/td>\u003ctd data-label=\"Status\">\u003cstrong>Operational\u003c/strong>\u003c/td>\u003ctd data-label=\"Notes\">The full approved property set is imported and reconciled into Production. The properties originally held back for a property-type schema refinement were \u003cstrong>classified and imported on 2026-08-13\u003c/strong> — none remain held.\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"Platform area\">\u003cstrong>Units\u003c/strong>\u003c/td>\u003ctd data-label=\"Status\">\u003cstrong>Operational\u003c/strong>\u003c/td>\u003ctd data-label=\"Notes\">Unit records with occupancy/vacancy are \u003cstrong>imported into Production\u003c/strong> (2026-08-14), completing the master-data foundation of organizations, properties and units.\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"Platform area\">\u003cstrong>Tenants\u003c/strong>\u003c/td>\u003ctd data-label=\"Status\">\u003cstrong>Operational\u003c/strong>\u003c/td>\u003ctd data-label=\"Notes\">Real tenant records entered by Avah since 2026-09-22, with contact details, notes, a ledger summary and search.\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"Platform area\">\u003cstrong>Leases\u003c/strong>\u003c/td>\u003ctd data-label=\"Status\">\u003cstrong>Operational\u003c/strong>\u003c/td>\u003ctd data-label=\"Notes\">Real leases in Production since 2026-09-22 — fixed-term and month-to-month, activation, termination and vacancy, signed lease files stored privately with each lease, and \u003cstrong>rent due on each lease's own day\u003c/strong> (2026-09-23). Start dates and terms are corrected through recorded, reasoned changes.\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"Platform area\">\u003cstrong>Rent Management\u003c/strong>\u003c/td>\u003ctd data-label=\"Status\">\u003cstrong>Operational\u003c/strong>\u003c/td>\u003ctd data-label=\"Notes\">\u003cem>In daily use with real tenants since 2026-09-22.\u003c/em> Monthly rent is \u003cstrong>generated automatically\u003c/strong> rather than by someone remembering to run it, and is \u003cstrong>correctly prorated\u003c/strong> when a tenant moves in or out part-way through a month. An issued charge is never rewritten; an automatic charge says the system created it rather than naming a person. Rent becomes late five days after its own due date — \u003cstrong>a status only; no late-fee policy exists, and late-fee practice will be settled from Avah's real tracker.\u003c/strong> \u003cstrong>A payment entered in error is reversed, never deleted\u003c/strong> — the months it paid reopen and nothing implies a refund (development platform, 2026-09-15). \u003cstrong>Payments and credit apply to any of the same tenant's charges\u003c/strong>, with a duplicate-charge warning and a recorded waiver for a charge created in error. Late stays a status; any late fee is entered by hand.\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"Platform area\">\u003cstrong>Deposits\u003c/strong>\u003c/td>\u003ctd data-label=\"Status\">\u003cstrong>Operational\u003c/strong>\u003c/td>\u003ctd data-label=\"Notes\">\u003cem>Real deposits recorded since 2026-09-22.\u003c/em> Each deposit records \u003cstrong>every payer separately\u003c/strong> — for example a tenant's refundable portion and an employer's nonrefundable funding — with an append-only history of how each portion was settled, so the refundable amount is never assumed to be the whole deposit. The move-out practice around settlement is still an open owner decision. \u003cstrong>Avah's role records who paid a deposit\u003c/strong>; approving a refund stays with executives. QuickBooks remains the accounting system of record.\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"Platform area\">\u003cstrong>Documents &amp; Photos\u003c/strong>\u003c/td>\u003ctd data-label=\"Status\">\u003cstrong>Built\u003c/strong>\u003c/td>\u003ctd data-label=\"Notes\">Signed lease files and work-order attachments are stored privately and opened only through a permission check. Uploaded files are not yet in a separate backup — a decision with Nick, Jess and the owner.\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"Platform area\">\u003cstrong>Maintenance\u003c/strong>\u003c/td>\u003ctd data-label=\"Status\">\u003cstrong>Operational\u003c/strong>\u003c/td>\u003ctd data-label=\"Notes\">\u003cem>Patron is the system of record for work orders since 2026-09-23.\u003c/em> Work orders open in a \u003cstrong>single working view\u003c/strong> — the job, its checklist, its photos and its history together — and each row says what the job is actually about. The responsible person is \u003cstrong>notified\u003c/strong> when something becomes theirs and can be \u003cstrong>mentioned by name\u003c/strong>; a \u003cstrong>dispatch package\u003c/strong> is prepared from selected work and handed to Gmail, where the recipient is chosen and the send happens. A job's checklist can be edited after it is created, and tenant requests arrive through an intake reviewed by a person.\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"Platform area\">\u003cstrong>Transactional email\u003c/strong>\u003c/td>\u003ctd data-label=\"Status\">\u003cstrong>Operational\u003c/strong>\u003c/td>\u003ctd data-label=\"Notes\">Invitation, password-reset and failure-alert emails are connected on the development platform, keep \u003cem>saved\u003c/em> and \u003cem>sent\u003c/em> as separate facts, and use an email link only when a person presses its button. \u003cstrong>Accepted by Nick 2026-09-16\u003c/strong> after live tests — a link survives an email scanner, a used link is refused, and an alert is sent once per incident. \u003cstrong>Live in Production since 2026-09-17.\u003c/strong> Gmail is connected for Dispatch in Production (drafts only; it never sends); the first real draft waits for Nick's go.\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"Platform area\">\u003cstrong>POCC Web interface\u003c/strong>\u003c/td>\u003ctd data-label=\"Status\">\u003cstrong>Archived (read-only history)\u003c/strong>\u003c/td>\u003ctd data-label=\"Notes\">The browser front end to the operations command center, live in Production from 2026-09-05. \u003cstrong>Since 2026-09-23 its work lives in Patron;\u003c/strong> it shows an archive notice that points people to Patron and is kept as read-only history.\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"Platform area\">\u003cstrong>September operating model\u003c/strong>\u003c/td>\u003ctd data-label=\"Status\">\u003cstrong>Operational\u003c/strong>\u003c/td>\u003ctd data-label=\"Notes\">The approved classification, reserve and reimbursement model now runs \u003cstrong>in Patron\u003c/strong> — projects with their current available balance, bank transactions, the Tools &amp; Gas reserve and entity reimbursements, imported and reconciled on 2026-09-23; recording refunds is live since 2026-10-02. History is preserved untouched.\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"Platform area\">\u003cstrong>Executive Reporting\u003c/strong>\u003c/td>\u003ctd data-label=\"Status\">\u003cstrong>Operational\u003c/strong>\u003c/td>\u003ctd data-label=\"Notes\">Eleven reports on the Reports page (observed live 2026-10-02) read the same records as the working pages — rent, occupancy, lease endings, project balances, reserves, work-order aging and vendors — including the Project Spending Report and the Custom Bank Transactions Report, printable as PDF (released 2026-10-02); plus the public Executive Operations Brief, which since 2026-10-02 also carries this binder.\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"Platform area\">\u003cstrong>Atlas / Athena\u003c/strong>\u003c/td>\u003ctd data-label=\"Status\">\u003cstrong>Operational\u003c/strong>\u003c/td>\u003ctd data-label=\"Notes\">Development continuity — durable memory, daily closeout, recompiled context: consistent, reviewable, recoverable.\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"Platform area\">\u003cstrong>Property Development\u003c/strong>\u003c/td>\u003ctd data-label=\"Status\">\u003cstrong>Preview\u003c/strong>\u003c/td>\u003ctd data-label=\"Notes\">Property-lifecycle vision (acquisition → operations) supporting Dave's capital planning. Not a built capability.\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"Platform area\">\u003cstrong>Cash &amp; Entity Funding\u003c/strong>\u003c/td>\u003ctd data-label=\"Status\">\u003cstrong>Preview\u003c/strong>\u003c/td>\u003ctd data-label=\"Notes\">Financial view previewed; Post It 3.0 remains the source of truth — not yet modeled.\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"Platform area\">\u003cstrong>Liberty\u003c/strong>\u003c/td>\u003ctd data-label=\"Status\">\u003cstrong>Planned\u003c/strong>\u003c/td>\u003ctd data-label=\"Notes\">The special invoice-driven lease; designed and approved, sequenced later.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Status terms\u003c/strong> — \u003cstrong>Operational\u003c/strong> (real and in use) · \u003cstrong>Production Ready\u003c/strong> (secure foundation ready to switch on) · \u003cstrong>Built\u003c/strong> (working on demonstration data) · \u003cstrong>In Progress\u003c/strong> (actively underway) · \u003cstrong>Preview\u003c/strong> (shown, not yet built) · \u003cstrong>Planned\u003c/strong> (approved, sequenced) · \u003cstrong>Future\u003c/strong> (directional) · \u003cstrong>Archived\u003c/strong> (kept as read-only history).\u003c/p>\n\u003ch3>Current Initiative\u003c/h3>\n\u003cp>\u003cstrong>Acceptance and the category backlog, then the independent review\u003c/strong> — Patron is the system of record; Chance, John, Jess and Matt have joined, Jess's first use and Eric's use are accepted (Owner Reports), and project balance warnings are live. Now: categorizing older expenses by hand, leadership using their balance alerts, report users' own first use, how new projects are entered with Dave's approved budget, and the independent security review, which Nick has deferred for a few weeks.\u003c/p>\n\u003cblockquote>\u003cp>Planning ✓ → Environment Audit ✓ → Persistence ✓ → Production Readiness ✓ → Master Data Import ✓ → Internal release ✓ \u003cem>(2026-09-17)\u003c/em> → Residential Onboarding — Avah ✓ \u003cem>(2026-09-22)\u003c/em> → POCC into Patron ✓ \u003cem>(2026-09-23)\u003c/em>\u003cstrong> → \u003c/strong>People and acceptance ◄ now (Eric ✓ signed in · his phone check · John · Jess) → Independent review → Wider use\u003c/p>\u003c/blockquote>\n\u003cp>\u003cem>Patron runs the company's day-to-day work in Production for named internal staff: Avah's residential work since September 22, and since September 23 the work orders, projects, bank transactions and reserves that used to live in POCC. Eric works his assigned jobs in Patron. Every person's own acceptance is theirs — an administrator's preview never stands in for it — and the platform is \u003cstrong>not\u003c/strong> described as independently reviewed until that review happens.\u003c/em>\u003c/p>\n\u003cp>\u003cem>Earlier milestones (the Production environment from August, POCC Web's launch on 2026-09-05, the internal release on 2026-09-17) remain in the Recently Completed list below.\u003c/em>\u003c/p>\n\u003ch3>Recently Completed\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Project balance warnings and the expense review screen (2026-10-01) — released and switched on\u003c/strong> — percentage remaining against each funding cycle's starting balance, alerts to Jess, John, Nick and Chance, a personal Clear alert; many older expenses categorized at once, by hand; reserve expenses take no category\u003c/li>\u003cli>\u003cstrong>Jess's first use and Eric's use accepted (2026-10-01)\u003c/strong> — Owner Reports by Nick\u003c/li>\u003cli>\u003cstrong>Project summary reports (2026-09-29)\u003c/strong> — a one-page branded summary of any project for an owner meeting, built in the browser: current position, spending by category for a chosen period and current progress; optional employee hours appear only in the PDF and are never saved\u003c/li>\u003cli>\u003cstrong>Expense categories (2026-09-29)\u003c/strong> — Materials, Vendor Invoice, Labor or In House Labor on every new bank expense; older expenses stay Uncategorized until reviewed\u003c/li>\u003cli>\u003cstrong>Access-request notifications, Matt's Workspace and unit-to-lease navigation (2026-09-29)\u003c/strong> — deciders are notified of requests; Matt's leases and tenants in one place; a unit opens its current lease\u003c/li>\u003cli>\u003cstrong>Jess and Matt onboarded (2026-09-29)\u003c/strong> — both accepted their invitations and set up their second factor themselves\u003c/li>\u003cli>\u003cstrong>Monthly Budget Request (2026-09-28)\u003c/strong> — each month's project funding request prepared in Patron: suggestions for projects below zero from their current balance, editable lines and paying entities, a contingency that never counts itself, totals by paying entity, saved drafts and a branded one-page PDF; a request only, with its own permission\u003c/li>\u003cli>\u003cstrong>Security page, work-order creation and Responsible at creation (2026-09-28)\u003c/strong> — the dated internal assessment and recovery status shown in the product (not an independent review); title, work items and notes at creation; the Responsible person chosen when work is created\u003c/li>\u003cli>\u003cstrong>Chance and John onboarded (2026-09-28)\u003c/strong> — both accepted their invitations and set up their second factor themselves\u003c/li>\u003cli>\u003cstrong>Fourteen releases (2026-09-25)\u003c/strong> — John's phone-first workspace; one workspace pattern; Record view and store names in Bank Transactions with sorting across every row; clearer Tenant Ledger, Leases, Reimbursements and Reports; lists past 1,000 rows; an audited activity view with a 60-day usage record; the app icon from the original artwork; Chance's Workspace\u003c/li>\u003cli>\u003cstrong>Bank Transactions easier to read and filter (2026-09-24)\u003c/strong> — three releases: vendor and property choices that filter as you type; a compact filter bar with removable chips; rows named by vendor or memo; short dates; a one-click entity and classification copy; receipt as Uploaded or No receipt; the property shown once\u003c/li>\u003cli>\u003cstrong>POCC moved into Patron (2026-09-23)\u003c/strong> — work orders with their checklists, project tracking, bank transactions and the September reserve and funding records imported and reconciled; POCC Web and the Google Sheet archived as read-only history; Avah's operational access turned on\u003c/li>\u003cli>\u003cstrong>Eric onboarded as Field Lead (2026-09-23)\u003c/strong> — his own password and second factor; his fourteen queued jobs matched one by one against the archived Sheet and assigned to him, with one notification per active job\u003c/li>\u003cli>\u003cstrong>Sixteen releases (2026-09-23)\u003c/strong> — rent due on each lease's own day; live management reports and a published occupancy rate; Field Lead and Leadership roles and simpler invitations; Jess's financial overview; editing a job's checklist after creation; accurate Dispatch and Attention counts; menus that keep their categories when rearranged; property lists searchable by typing\u003c/li>\u003cli>\u003cstrong>Avah onboarded and working daily (2026-09-22)\u003c/strong> — first real tenants, leases, charges, payments and deposits; twelve releases the same day fixing what she met while working\u003c/li>\u003cli>\u003cstrong>Personal workspaces and access requests released (2026-09-21)\u003c/strong> — with signed lease files, work-tool handoffs, truthful Settings, property cities and a reviewed tenant maintenance intake\u003c/li>\u003cli>\u003cstrong>Next release prepared and tested (2026-09-18, development platform)\u003c/strong> — personal home workspaces, My Access requests with administrator decisions and automatic expiry, sessions ended on deactivation, and one shared definition of access; testing with a test employee account found and fixed several problems before release; released 2026-09-21\u003c/li>\u003cli>\u003cstrong>Gmail connected for Dispatch in Production (2026-09-18)\u003c/strong> — a separate Production connection with its own key; drafts only; the first real draft waits for Nick's go\u003c/li>\u003cli>\u003cstrong>Per-person access areas released to Production (2026-09-18)\u003c/strong> — an administrator chooses which of seven areas each person reaches, never beyond their role, enforced by the database; tested on the development platform, applied to Production with the company's records unchanged, and confirmed by Nick after signing in\u003c/li>\u003cli>\u003cstrong>Patron Platform released to Production for internal office use (2026-09-17)\u003c/strong> — after a rehearsal on a copy of real data and an internal security review that found and fixed a critical sign-in weakness; residential-first access passed its browser test first\u003c/li>\u003cli>\u003cstrong>Residential-first access control (2026-09-16, development platform)\u003c/strong> — a new account can start with residential work only; operational access stays off on the server until an administrator turns it on with two-factor sign-in, a reason and an audit record, and an ordinary access request cannot get around it. Proven in server and automated tests; final browser test pending\u003c/li>\u003cli>\u003cstrong>Payments accepted (2026-09-16, development platform)\u003c/strong> — unapplied rent credit is shown to the cent and applies only to the same tenant's charges; accepted by Nick after his retest\u003c/li>\u003cli>\u003cstrong>Email accepted on the development platform (2026-09-16)\u003c/strong> — invitation, password reset and failure alerts proven live; two problems found and fixed during testing; accepted by Nick\u003c/li>\u003cli>\u003cstrong>Payment and lease corrections for cutover (2026-09-15, development platform)\u003c/strong> — a payment entered in error is reversed, not deleted; a lease's start date or type is corrected before rent exists; browser-verified, including a fix for an amount-entry error; both now accepted\u003c/li>\u003cli>\u003cstrong>Deposit entry for Avah's role (2026-09-15, development platform)\u003c/strong> — recording who paid a deposit; refunds, approvals and administration excluded\u003c/li>\u003cli>\u003cstrong>Employee offboarding without erasing history (2026-09-14, development platform)\u003c/strong> — a departing person's account is deactivated, never deleted: access ends at once, sign-in is blocked, and everything they did stays attributed to them. Tested end to end by Nick with a test account and \u003cstrong>accepted\u003c/strong>\u003c/li>\u003cli>\u003cstrong>Patron installable on a phone (2026-09-14, development platform)\u003c/strong> — a home-screen app that opens the same system, deliberately with no offline copy of records; Nick installed it on Android, two layout issues he found were fixed, and he \u003cstrong>accepted\u003c/strong> it. iPhone not yet tested\u003c/li>\u003cli>\u003cstrong>Transactional email built, not yet connected (2026-09-14)\u003c/strong> — invitations and failure alerts, honest about the difference between saved, handed over and delivered; waiting on the email-service set-up and acceptance\u003c/li>\u003cli>\u003cstrong>Governed Production environment created\u003c/strong> — dedicated Production database on Supabase \u003cstrong>Pro\u003c/strong> (Vercel also Pro), isolated from Dev/Staging; target verified as Production before any change\u003c/li>\u003cli>\u003cstrong>Production security model live-validated\u003c/strong> — migration chain 0001→0010 applied (local == live), authorization baseline seeded once (6 roles · 35 capabilities · 127 mappings), and the full access-control/security suite passed \u003cem>in Production\u003c/em>, with every test rolled back leaving no residue\u003c/li>\u003cli>\u003cstrong>Auth/session hardening\u003c/strong> — 30-day absolute and 7-day inactivity session limits, MFA, invitation-only access, public and anonymous sign-ups disabled, email confirmation on\u003c/li>\u003cli>\u003cstrong>Backups active + restore rehearsals passed (2026-08-12, history)\u003c/strong> — Pro daily backups on at the time; a restore-to-new-project rehearsal exercised the mechanism (scratch project created, then deleted), and the \u003cstrong>seeded-state restore rehearsal passed on 2026-08-12\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Master Data imported to Production and reconciled\u003c/strong> — the approved onboarding scope was validated on synthetic data, then imported for real through the governed, permission-checked path; the properties initially held for a schema refinement were classified and imported on 2026-08-13\u003c/li>\u003cli>\u003cstrong>Phase 1A\u003c/strong> — Environment &amp; Persistence Readiness Audit (complete and accepted)\u003c/li>\u003cli>\u003cstrong>Residential persistence\u003c/strong> — tenants/leases schema + governed relationship and read/write path, fail-closed\u003c/li>\u003cli>\u003cstrong>Work-order completion notifications\u003c/strong> — teammates notified when a work order is finished (in-app/demonstration)\u003c/li>\u003cli>\u003cstrong>Funded-deposit requirements (Draft 1)\u003c/strong> — Security Deposit / Funding Sources / Settlement History approved (design)\u003c/li>\u003cli>\u003cstrong>POCC Web now SAVES to the live workbook (2026-09-05, evening)\u003c/strong> — enabled as its own separate decision hours after the read-only deployment was verified; the first save was a \u003cstrong>true operational update\u003c/strong> on a real work order, confirmed, retained after a refresh, matched in the workbook, and \u003cstrong>kept\u003c/strong>. A planned fake-record-then-delete first save was \u003cstrong>rejected\u003c/strong>. A read-only version was built and set aside \u003cstrong>before\u003c/strong> enabling, so rollback is a prepared step. Saving applies to everyone with existing edit access who can open the app.\u003c/li>\u003cli>\u003cstrong>POCC Web LIVE IN PRODUCTION, read-only and verified (2026-09-05)\u003c/strong> — a permanent web address showing real operational and financial
