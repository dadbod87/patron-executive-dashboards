<style>
  :root{
    /* The Patron Group's report palette (lib/budget-request/pdf.ts, from the company website) with the app's type scale */
    --ink:#172320; --ink-2:#2c3a36; --muted:#59625e; --subtle:#737b77;
    --paper:#f5f2ea; --canvas:#f7f5f0; --surface:#ffffff; --line:#e7e4dc; --line-2:#d9d4c7;
    --gold:#b8915d; --gold-text:#8a6a3f; --gold-soft:#f3ecdf;
    --ok:#2f6b4f; --ok-soft:#e5f0ea; --warn:#8a5a14; --warn-soft:#f7ecd9; --info:#2f5579; --info-soft:#e6eef6;
    --violet:#5b4d7a; --violet-soft:#ece8f3; --grey-soft:#eeece7;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --r:12px; --shadow:0 1px 2px rgba(23,35,32,.04),0 8px 24px -12px rgba(23,35,32,.12);
  }
  *{box-sizing:border-box}
  html{scroll-padding-top:72px}
  body{margin:0;background:var(--canvas);color:var(--ink);font:15.5px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
  a{color:var(--gold-text);text-underline-offset:3px}
  a:hover{color:var(--ink)}
  h1,h2,h3,h4{font-family:var(--serif);font-weight:600;color:var(--ink);line-height:1.2;margin:0}
  p{margin:0 0 .8em}
  code{font:0.86em ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--grey-soft);padding:.05em .35em;border-radius:4px}
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  /* ── Masthead: the report header — logo left, eyebrow + serif title right, gold rule ─────────────────────── */
  .topline{height:4px;background:linear-gradient(90deg,var(--gold),#d8bf8e 60%,var(--gold))}
  header.mast{background:var(--surface);border-bottom:1px solid var(--line)}
  .mast-in{display:flex;gap:28px;align-items:center;padding:26px 0 22px}
  .mast img{width:148px;height:auto;flex:none;display:block}
  .eyebrow{font:600 11.5px/1.3 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--gold-text)}
  .mast h1{font-size:40px;margin:6px 0 6px;letter-spacing:-.01em}
  .mast .sub{color:var(--muted);max-width:640px;margin:0}
  .rule{height:2px;background:var(--gold);opacity:.75;width:64px;margin:14px 0 0}

  /* Summary band — the paper band at the top of every generated report */
  .band{background:var(--paper);border-bottom:1px solid var(--line)}
  .band-in{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
  .band .cell{padding:14px 18px 14px 0}
  .band .cell+.cell{padding-left:18px;border-left:1px solid var(--line-2)}
  .k{font:600 10.5px/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .v{font:600 17px/1.35 var(--serif);color:var(--ink);margin-top:4px}
  .v small{display:block;font:400 12.5px/1.4 var(--sans);color:var(--muted);margin-top:2px}

  /* ── Navigation ─────────────────────────────────────────────────────────────────────────────────────────── */
  nav.views{position:sticky;top:0;z-index:10;background:rgba(247,245,240,.94);backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--line)}
  nav.views ul{list-style:none;margin:0 auto;padding:0 24px;max-width:1120px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
  nav.views ul::-webkit-scrollbar{display:none}
  nav.views a{display:block;white-space:nowrap;padding:14px 12px 12px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;border-bottom:2px solid transparent}
  nav.views a:hover{color:var(--ink)}
  nav.views a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--gold)}

  main{padding:28px 0 72px}
  section.view{display:none}
  section.view.on{display:block}
  .view-head{margin:4px 0 22px}
  .view-head h2{font-size:30px}
  .view-head p{color:var(--muted);margin:6px 0 0;max-width:760px}
  .block{margin:0 0 30px}
  .block>h3{font-size:21px;margin:0 0 4px}
  .block>.lead{color:var(--muted);margin:0 0 14px;max-width:780px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g4{grid-template-columns:repeat(4,minmax(0,1fr))}

  .focus{border-left:3px solid var(--gold);background:var(--gold-soft);border-radius:0 var(--r) var(--r) 0;padding:16px 20px;margin:0 0 22px;display:flex;gap:18px}
  .focus .k{flex:none;padding-top:3px;color:var(--gold-text)}
  .stat .num{font:600 30px/1.1 var(--serif);color:var(--ink)}
  .stat .lab{font-weight:650;margin:6px 0 4px}
  .stat .sub{color:var(--muted);font-size:14px;margin:0}
  .stat{border-top:3px solid var(--gold)}
  dl.brief{margin:0;display:grid;grid-template-columns:200px minmax(0,1fr);gap:0}
  dl.brief dt{font:600 12px/1.4 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-text);padding:16px 16px 16px 0;border-top:1px solid var(--line)}
  dl.brief dd{margin:0;padding:14px 0;border-top:1px solid var(--line)}
  dl.brief dd p:last-child{margin:0}
  ul.plain{margin:0;padding-left:1.1em}
  ul.plain li{margin:0 0 .5em}
  ul.plain li::marker{color:var(--gold)}

  .badge{display:inline-block;font:650 10.5px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:5px 7px;border-radius:999px;vertical-align:2px;white-space:nowrap}
  .b-fact,.s-op{background:var(--ok-soft);color:var(--ok)}
  .b-report{background:var(--info-soft);color:var(--info)}
  .b-hyp,.b-potential,.s-progress{background:var(--warn-soft);color:var(--warn)}
  .b-rec,.b-future{background:var(--violet-soft);color:var(--violet)}
  .b-estimated{background:var(--gold-soft);color:var(--gold-text)}
  .b-unknown,.s-arch{background:var(--grey-soft);color:var(--muted)}
  .s-complete{background:var(--ok-soft);color:var(--ok)}
  .s-built{background:var(--info-soft);color:var(--info)}

  /* ── Daily progress timeline ───────────────────────────────────────────────────────────────────────────── */
  .tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 18px}
  .tools input[type=search]{flex:1 1 260px;min-width:0;font:inherit;padding:10px 14px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);color:var(--ink)}
  .tools input:focus,.chip:focus-visible,nav.views a:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font:600 13px/1 var(--sans);padding:9px 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .count{color:var(--muted);font-size:13.5px;margin:0 0 10px}
  ol.timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--line-2);margin-left:6px}
  ol.timeline>li{position:relative;padding:0 0 14px 22px}
  ol.timeline>li::before{content:"";position:absolute;left:-7px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--gold)}
  ol.timeline>li.update::before{background:var(--gold)}
  details.entry{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  details.entry>summary{list-style:none;cursor:pointer;padding:14px 18px;display:grid;grid-template-columns:170px minmax(0,1fr) auto;gap:14px;align-items:baseline}
  details.entry>summary::-webkit-details-marker{display:none}
  .when{font:600 14px/1.3 var(--serif);color:var(--ink)}
  .when small{display:block;font:400 12px/1.3 var(--sans);color:var(--muted)}
  .gist{color:var(--ink-2)}
  .gist strong{color:var(--ink)}
  .more{font:600 12.5px/1 var(--sans);color:var(--gold-text);white-space:nowrap}
  details[open] .more .o{display:none}
  details:not([open]) .more .c{display:none}
  .entry .body{padding:0 18px 16px 202px;color:var(--ink-2)}
  .entry .body p:last-child{margin-bottom:0}

  /* ── Rendered binder chapters ──────────────────────────────────────────────────────────────────────────── */
  .prose>p,.prose>ul,.prose>ol,.prose>blockquote,.prose>h3,.prose>h4,.prose>h5{max-width:78ch}
  details.chap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin:0 0 12px}
  details.chap>summary{cursor:pointer;list-style:none;padding:16px 20px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
  details.chap>summary::-webkit-details-marker{display:none}
  details.chap>summary h3{font-size:19px}
  details.chap>.prose{padding:0 20px 18px}
  .prose h3{font-size:19px;margin:20px 0 8px}
  .prose h4,.prose h5{font-size:16.5px;margin:18px 0 6px}
  .prose blockquote{margin:12px 0;padding:12px 16px;border-left:3px solid var(--gold);background:var(--paper);border-radius:0 10px 10px 0}
  .prose blockquote p:last-child{margin:0}
  .prose hr{border:0;border-top:1px solid var(--line);margin:18px 0}
  .prose ul,.prose ol{padding-left:1.25em;margin:0 0 .9em}
  .prose li{margin:0 0 .35em}
  .prose li::marker{color:var(--gold)}
  .check{display:inline-block;width:13px;height:13px;border:1.5px solid var(--gold);border-radius:3px;margin-right:8px;vertical-align:-1px}
  .check.done{background:var(--gold)}
  .prose li:has(>.check){list-style:none;margin-left:-1.1em}
  .table{overflow-x:auto;margin:10px 0 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th{text-align:left;font:650 11px/1.3 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--paper);padding:10px 12px;border-bottom:1px solid var(--line-2)}
  td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
  tbody tr:first-child td{border-top:0}

  /* ── System map ────────────────────────────────────────────────────────────────────────────────────────── */
  .tier{margin:0 0 18px}
  .tier h4{font:600 12px/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-text);margin:0 0 10px}
  .node h5{font:600 16.5px/1.25 var(--serif);margin:0 0 6px}
  .node .meta{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
  .node p{color:var(--ink-2);font-size:14.5px;margin:0}
  .owner{font:600 11px/1 var(--sans);color:var(--muted);padding:5px 0}

  .kind{display:inline-block;font:650 10.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:6px;border:1px solid currentColor;vertical-align:4px;margin-left:8px;white-space:nowrap}
  .k-delivered{color:var(--ok)} .k-release{color:var(--info)} .k-acceptance{color:var(--violet)}
  .k-plan{color:var(--warn)} .k-decision{color:#9a3b2f} .k-status{color:var(--muted)} .k-record{color:var(--gold-text)}
  .intro{border-top:3px solid var(--ink)}
  .intro p:last-child{margin-bottom:0}
  dl.brief dt .kind{margin:6px 0 0;display:table}
  .skip{position:absolute;left:-9999px;top:8px;z-index:100;background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px}
  .skip:focus{left:16px}
  a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
  h3.h{font-size:18px;margin:0 0 10px}
  .small{font-size:13.5px;margin:10px 0 0}
  ul.tags{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
  ul.tags li{font:600 13px/1.2 var(--sans);background:var(--ok-soft);color:var(--ok);border-radius:999px;padding:6px 10px}
  .glance+.glance{margin-top:14px}
  .glance .k{margin:0 0 8px}
  .glance:not(.live) ul.tags li{background:var(--grey-soft);color:var(--ink-2)}
  .draft{background:var(--warn-soft);color:var(--warn);border-bottom:1px solid var(--line)}
  .draft .wrap{padding-top:10px;padding-bottom:10px;font-size:14px}
  details.inline{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  details.inline>summary{cursor:pointer;font-weight:650;color:var(--gold-text)}
  details.inline>.prose{padding-top:10px}
  details.chap>summary p.sum{margin:4px 0 0;color:var(--muted);font-size:14.5px}
  details.chap>.prose>.grid{margin:6px 0 10px}
  details.chap>.prose h4{font-size:16.5px;margin:18px 0 8px}
  ol.timeline>li.day{padding-bottom:18px}
  ol.timeline>li.day>h3.when{font:600 17px/1.3 var(--serif);margin:14px 0 8px;display:flex;gap:10px;align-items:baseline}
  ol.timeline>li.day>h3.when small{font:400 12.5px var(--sans);color:var(--muted)}
  ol.timeline>li.day>details.entry+details.entry{margin-top:8px}
  .tag{font:650 12px/1.3 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--gold-text)}
  .tag small{display:block;text-transform:none;letter-spacing:0;font:400 12.5px/1.35 var(--sans);color:var(--muted);margin-top:2px}
  .brainlink{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line);border-left:3px solid var(--gold);background:var(--surface);border-radius:var(--r);padding:16px 20px;box-shadow:var(--shadow)}
  .brainlink p{margin:0;color:var(--ink-2);min-width:0;flex:1 1 260px}
  .btn{display:inline-flex;align-items:center;gap:8px;font:650 14.5px/1 var(--sans);text-decoration:none;color:#fff;background:var(--ink);border-radius:10px;padding:12px 16px;white-space:nowrap}
  .btn:hover{color:#fff;background:var(--ink-2)}
  footer{border-top:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13px}
  footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 24px}
  .muted{color:var(--muted)}

  @media (max-width:900px){
    .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
    .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
    .band-in{grid-template-columns:repeat(2,minmax(0,1fr))}
    .band .cell:nth-child(3){padding-left:0;border-left:0}
    .band .cell:nth-child(n+3){border-top:1px solid var(--line-2)}
  }
  @media (max-width:640px){
    body{font-size:15px}
    .wrap{padding:0 16px}
    nav.views ul{padding:0 10px}
    .mast-in{flex-direction:column;align-items:flex-start;gap:14px;padding:20px 0 18px}
    .mast img{width:112px}
    .mast h1{font-size:30px}
    .g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}
    .band-in{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
    .band .cell{padding:12px 10px 12px 0}
    .band .cell+.cell{padding-left:10px}
    .band .cell:nth-child(3){padding-left:0}
    .v{font-size:15px}
    .view-head h2{font-size:25px}
    .focus{flex-direction:column;gap:6px}
    dl.brief{grid-template-columns:minmax(0,1fr)}
    dl.brief dt{padding:14px 0 0}
    dl.brief dd{border-top:0;padding:4px 0 14px}
    details.entry>summary{grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px}
    details.entry>summary .tag{grid-column:1 / -1}
    .entry .body{padding:0 14px 14px}
    ol.timeline>li{padding-left:16px}
    .card{padding:16px}
    /* Tables become labelled rows on a phone */
    .table{overflow:visible;border:0;background:transparent}
    .table table,.table tbody,.table tr,.table td{display:block;width:100%}
    .table thead{display:none}
    .table tr{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:0 0 10px;padding:6px 12px}
    .table td{border:0;padding:6px 0}
    .table td::before{content:attr(data-label);display:block;font:650 10.5px/1.3 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  }
  @media print{
    nav.views,.tools,.topline{display:none}
    section.view{display:block !important;break-before:page}
    details.entry{box-shadow:none} details.entry .body,details.chap>.prose{display:block}
    .card{box-shadow:none}
  }
</style>
</head>

<script type="application/json" id="site-data">{"meta":{"title":"Executive Operations Brief","sub":"Operational intelligence, strategic progress, and leadership priorities for The Patron Group — evidence-based, prepared by Project Atlas.","owner":"Nick Summerlin","audience":"Jess (COO) · John (Operations) · Dave (Owner)","readers":["Jess","John","Dave","Avah","Christy"],"asOf":"2026-10-05","lastReviewed":"2026-10-05","reviewOutcome":"Materially updated","lastMaterialUpdate":"2026-10-05","version":"v46 (2026-10-05, end of day)","binderVersion":"v1.35","binderDate":"2026-10-05","phase":"The Patron Platform is the company's system of record. On October 5 three releases went out, each approved by Nick and checked before and after release: the history of which records people open and what they export is now kept permanently; an administrator can give one person a single area — Monthly Budget Requests for Avah — without changing her role, and Administration now shows the access she already had; and Patron now watches its two nightly jobs — if either has not run successfully within 26 hours, administrators see a critical alert on System Health and in the bell. The first scheduled check succeeded. The watch cannot detect its own scheduler stopping and sends no e-mail by itself. The file backup still waits for a company Shared Drive.","currentFocus":"Reliability: an outside heartbeat and automatic alert e-mails for stalled jobs, then a rehearsed database restore (each awaiting Nick's approval); the company Shared Drive for the file backup (waiting for a Workspace administrator); Avah's training.","sources":{"brief":"work-impact/work-impact-dashboard.html","binder":"knowledge/onboarding/owner-onboarding-binder.md"}},"overview":{"brief":{"currentState":"The Patron Platform remains the company's system of record, in daily use; no tenant or customer has access to the platform. Three releases went out on October 5, each approved by Nick and checked before and after release.","whatChanged":"Released: the history of which records people open and what they export is kept permanently (staff are told only recorded pages and exports are kept); an administrator can grant one person a single area without a role change — Administration now shows Avah's existing Monthly Budget Requests access, which Nick confirmed displays correctly (Owner Report).","whatChangedAlso":"Released: Patron now watches its two nightly jobs (rent obligations and usage cleanup). A job that has not succeeded within 26 hours appears as a critical alert on System Health and in the administrators' bell, naming the job; the first scheduled check succeeded with nothing to report. The development database was brought up to date with no data lost.","whyItMatters":"A nightly job that silently stopped — such as the one that creates each month's rent charges — would previously have gone unnoticed; now administrators see it the same day. Accountability history can no longer age out.","currentRisks":"The job watch cannot see its own scheduler stop and sends no e-mail or text by itself; critical e-mail alerts go to Nick only. Uploaded files are still in no backup until a Workspace administrator sets up the Shared Drive; restoring the database has not been rehearsed; the independent security review has not happened.","tomorrowFocus":"Nick's decisions on an outside heartbeat and automatic alert e-mails, then a rehearsed database restore; the Shared Drive setup; Avah's training."},"cards":[{"num":"Live","label":"Nightly jobs watched","sub":"A nightly job that has not succeeded within 26 hours shows as a critical alert on System Health and in the bell; released October 5, first check succeeded. No e-mail by itself yet."},{"num":"Live","label":"Single-area access","sub":"An administrator can give one person one area without a role change; Avah's Monthly Budget Requests access now shows correctly (Owner Report)."},{"num":"Live","label":"History kept permanently","sub":"Which records people open and what they export (where recorded) is no longer deleted after 60 days; released October 5."},{"num":"Open","label":"Recovery coverage","sub":"Database: seven-day point-in-time recovery. Uploaded files: backup ready, waiting for a company Shared Drive. Restoring Production: not rehearsed."}],"today":["Released with Nick's approval: record-view and export history kept permanently, and single-area access grants — Avah's existing access now shows correctly (Nick confirmed).","Released with Nick's approval: Patron's two nightly jobs are watched; a stalled job becomes a critical alert on System Health and in the bell. First scheduled check succeeded.","Known limits recorded: the watch cannot see its own scheduler stop and sends no e-mail by itself; critical e-mails go to Nick only (Owner Decision).","The development database was brought up to date with every record preserved.","The file backup is ready; it waits for a Workspace administrator to set up the company Shared Drive (Nick and Chance manage it)."],"priority":["Nick's decision on an outside heartbeat and automatic alert e-mails for stalled jobs.","Then a rehearsed database restore into a temporary copy (small cost; Nick's approval).","A Workspace administrator sets up the company Shared Drive; then a test of the file backup with sample files.","Avah's training this week, and her own acceptance afterwards; then Jess's discovery.","The independent security review, deferred by Nick; the platform is not described as independently reviewed."],"next":["Nick trains Avah on Bank Transactions, receipts and invoices, project funding and balances — and possibly Monthly Budget Requests with John.","Nick decides the two waiting releases.","Set up the company Shared Drive for the file backup, then test it with sample files.","Learn how Jess organizes her day — discovery before any build.","Release project creation after its independent check, behind the reliability work."]},"progress":{"updates":[{"date":"2026-10-05","label":"Current update · 2026-10-05 end of day, v1.35","html":"\u003cp>Released with Nick's approval, each checked before and after release:\u003cstrong> the history of which records people open and what they export is now kept permanently; an administrator can give one person a single access area without changing their role — Administration now shows Avah's existing Monthly Budget Requests access, which Nick confirmed; and Patron now watches its two nightly jobs (rent obligations and usage cleanup), showing a critical alert on System Health and in the administrators' bell if either has not run successfully within 26 hours — the first check succeeded. \u003c/strong>Honest limits:\u003cstrong> the watch cannot detect its own scheduler stopping, and it sends no e-mail or text by itself; critical e-mail alerts go to Nick only (Nick's decision). The uploaded-file backup is ready and waits for a Workspace administrator to set up the company Shared Drive. \u003c/strong>Next (each on Nick's approval): an outside heartbeat and automatic alert e-mails, then a rehearsed database restore.\u003c/p>"},{"date":"2026-10-05","label":"Current update · 2026-10-05 morning, v1.34","html":"\u003cp>This week (Nick's decision):\u003cstrong> Avah's training and making Patron more reliable come before new features; nothing was released today. \u003c/strong>Ready for Nick's go-ahead:\u003cstrong> keeping the history of which records people open and what they export — the wording staff see is approved and independently reviewed. \u003c/strong>Prepared, not released: an administrator can give one person a single access area (Monthly Budget Requests for Avah) without changing her role; and every uploaded file will also be copied to a restricted company Shared Drive managed by Nick and Chance — built and tested with sample files, waiting for the drive to be set up. Patron keeps the originals.\u003c/p>"},{"date":"2026-10-04","label":"Current update · 2026-10-04 closeout, v1.33","html":"\u003cp>Released (Nick's approval, checked live):\u003cstrong> older bank transactions can be marked reviewed — who, when, and whether reconciliation is still open — with no change to any money. \u003c/strong>Nick's decisions:\u003cstrong> six older records stay exactly as they are; projects are created in Patron by Nick, Chance, John, Jess or Matt, and money counts only when it reaches the account and is recorded through the existing funding entry — there is no separate budget tracking; which records people open and what they export is kept permanently. \u003c/strong>Built, waiting for his release decision:\u003cstrong> keeping that history permanently (until then it is still deleted after 60 days — the earliest in late November) and creating projects. \u003c/strong>Planned: Avah's training this week, then learning how Jess organizes her day.\u003c/p>"},{"date":"2026-10-02","label":"Current update · 2026-10-02 closeout, v1.32","html":"\u003cp>Nick decided the company's retention policy:\u003cstrong> real business records — financial and operational records, receipts, supporting documents, approvals and the history of changes — never expire automatically and must stay searchable years from now; archiving may move them but must keep them searchable; only technical page-view records keep a 60-day limit. Whether the history of which records people opened, and of exports, counts as a business record is his next decision. \u003c/strong>New projects:\u003cstrong> after Dave approves, Nick, John, Jess or Chance creates the project and enters the approved budget — and an approved budget is a recorded figure, never money received or available; a way to create projects is built and waits on Nick's decisions about how budgets are reported. \u003c/strong>Marking an older transaction reviewed\u003cstrong> (who, when, and whether reconciliation is still open) is built and being checked independently; no transaction's review flag has been cleared. \u003c/strong>People: Nick trains Avah next week on what is live (paying invoices is recorded through Bank Transactions; Patron has no invoice-payment step yet); before anything is built for Jess, Atlas first learns how she organizes her day.\u003c/p>"},{"date":"2026-10-02","label":"Current update · 2026-10-02","html":"\u003cp>Four releases reached Production, each approved by Nick and checked before release and again live.\u003cstrong> \u003c/strong>Recording refunds\u003cstrong> is live: money back on an expense stays with the project or entity it was recorded against and carries forward as credit when it exceeds a month's obligation — corrected before release so an unlinked refund keeps its recorded entity, then reviewed independently again. \u003c/strong>An expense keeps the entity it was recorded with\u003cstrong>; moving one is an explicit, confirmed choice. The \u003c/strong>W-9 report\u003cstrong> shows an error with a retry, never an all-clear, when its data fails to load. The \u003c/strong>Reports page\u003cstrong> offers a Project Spending Report and a Custom Bank Transactions Report in Excel and PDF; their live totals matched the database. \u003c/strong>People (Owner Reports, Nick):\u003cstrong> Nick recorded real past refunds and reports the workflow worked; a property with no entity blocked a save until its entity was created and assigned with his approval, and his expense then saved. One older expense was attributed to its project through an owner-approved, audited exception that changed no balance. \u003c/strong>Owner Reports (Nick, 2026-10-02):\u003cstrong> rent, deposits and Avah's operational records are verified; the daily workflow and maintenance are verified; and every implemented workflow has been tested and is working — Nick's own confirmation of what is built, not an independently run test and not a statement about unbuilt features. Eric's own confirmation of his phone workspace is still open. \u003c/strong>Also confirmed by Nick (2026-10-02):\u003cstrong> the reserve balances, categories and targets are correct (reviewed with Chance on October 1); new projects are created by hand after Dave approves them — by Nick, John, Jess or Chance — though Patron cannot yet create a project itself; and the proposed independent security reviewer is John's brother, a software developer, not yet appointed or scheduled. \u003c/strong>Recovery, kept separate:\u003cstrong> the database has point-in-time recovery (seven days by about October 8); uploaded files are in no backup; restoring today's Production has not been rehearsed. \u003c/strong>The independent security review is deferred by Nick for a few weeks and is still required.\u003c/p>\n\u003cp>\u003cstrong>Publication:\u003c/strong> v1.29 — the first edition published inside the combined Executive Operations Brief at its main address (2026-10-02, on Nick's GO; read back live). v1.30 and v1.31 followed the same day, each read back live; v1.32 was the 2026-10-02 closeout edition (read back live); v1.33 is the 2026-10-04 edition.\u003c/p>"},{"date":"2026-10-01","label":"October 1 (end of day)","html":"\u003cp>Five releases reached Production, each approved by Nick and checked before release and again live.\u003cstrong> Project balance warnings are switched on (each project measured against its \u003c/strong>warning starting balance\u003cstrong>, not an approved budget), with a fast review screen for categorizing older expenses by hand; \u003c/strong>Other\u003cstrong> is a fifth expense category; project reports list only categories with spending; \u003c/strong>Bank Transactions can be exported to Excel\u003cstrong> with the same filters the register shows (Chance's request; he confirmed the filtered totals in Excel); and search also finds words in a transaction's \u003c/strong>Store / Notes\u003cstrong>. \u003c/strong>Production's database now has point-in-time recovery\u003cstrong> for the last seven days (the window fills by October 8): it covers the database only — uploaded files are not yet backed up — and a restore has not been rehearsed. \u003c/strong>Recording refunds\u003cstrong> was built and independently reviewed, then \u003c/strong>held at the release check for one more correction\u003cstrong> to how a refund keeps its entity; nothing changed in Production. A \u003c/strong>Reports page\u003cstrong> with a printable bank transactions report waits behind it. A fix is queued so the \u003c/strong>W-9 report\u003cstrong> never shows an all-clear when its data fails to load. \u003c/strong>People:\u003cstrong> Jess's first use and Eric's use are accepted (Owner Reports). \u003c/strong>The independent security review is deferred by Nick for a few weeks and is still required.\u003c/p>\n\u003cp>\u003cstrong>Publication:\u003c/strong> v1.28 — published 2026-10-01 at the Daily Closeout under Nick's standing approval.\u003c/p>"},{"date":"2026-10-01","label":"the October 1 checkpoint","html":"\u003cp>\u003cstrong>Project balance warnings are live.\u003c/strong> After Nick decided how they work, they were released and switched on the same day with his approval: each project is measured against the balance it held when its current funding cycle began — a \u003cstrong>warning starting balance\u003c/strong>, which is not an approved budget. A project turns amber \u003cstrong>Running low\u003c/strong> below 40% remaining and red \u003cstrong>Critical\u003c/strong> below 20%, and shows red \u003cstrong>Funds exhausted\u003c/strong> at zero and \u003cstrong>Overdrawn — needs funding\u003c/strong> below it. Jess, John, Nick and Chance are alerted in their bell and on Attention when a project first drops below 40% and again when it reaches zero, and each can clear their own alert without hiding the project's warning. Five projects started healthy and three overdrawn projects raised their first alerts. A \u003cstrong>fast review screen\u003c/strong> lets a person choose categories for many older expenses at once, by hand — nothing is guessed — and \u003cstrong>reserve expenses no longer take a category\u003c/strong>. Every database, simultaneous-save, rollback and screen check passed before release, and the live pages were checked afterwards without changing anything. \u003cstrong>People:\u003c/strong> Jess's first use went well with Nick walking her through, and Eric's use is accepted (both Owner Reports); report users' own first use is still to come. \u003cstrong>New projects:\u003c/strong> Dave approves a project and its amount, then Nick, Chance, Jess or John enters it in Patron — an approval never creates funding; Patron cannot yet add a project with its approved budget, which is recorded as a separate gap. \u003cstrong>Atlas\u003c/strong> now completes its work in one main AI session. \u003cstrong>The independent security review is deferred by Nick for a few weeks and is still required.\u003c/strong>\u003c/p>"},{"date":"2026-09-29","label":"September 29","html":"\u003cp>Seven releases reached Production, each checked before release and again live.\u003cstrong> \u003c/strong>Access requests\u003cstrong> now notify the administrators who can decide them, in the bell and on Attention. \u003c/strong>Matt's Workspace\u003cstrong> opens his leases and tenants. \u003c/strong>A unit\u003cstrong> opens its one current lease page from every screen. \u003c/strong>Bank Transactions\u003cstrong> now carry an \u003c/strong>expense category\u003cstrong> — Materials, Vendor Invoice, Labor or In House Labor — required on every new expense (released in two stages so no open screen broke); older expenses stay Uncategorized until someone reviews them. \u003c/strong>Project reports:\u003cstrong> any person who can open a project can generate a \u003c/strong>one-page, branded project summary\u003cstrong> for an owner meeting — current position, spending by category for a chosen period, and current progress — built in the browser; optional employee hours are shown only in that PDF and never saved; \u003c/strong>Generate report\u003cstrong> is the gold button on each project page, and Nick accepted the report interface. \u003c/strong>People:\u003cstrong> Jess and Matt accepted their invitations and set up their second factor themselves; John's and Matt's first use went well (Nick's report) and the October budget request was completed and printed. \u003c/strong>Next (then): original project budgets and John's low-budget warning awaited decisions; Eric's own phone check. \u003cem>(Both since decided or accepted — see the current update.)\u003c/em>\u003c/p>"},{"date":"2026-09-28","label":"September 28","html":"\u003cp>Five releases reached Production, each checked before release.\u003cstrong> \u003c/strong>The Security page\u003cstrong> now shows the dated internal security assessment — every finding with its status, and which recovery protections are and are not in place yet; it is an internal assessment, \u003c/strong>not\u003cstrong> an independent review. \u003c/strong>Work orders:\u003cstrong> creation asks for a title, the work items and notes, and the \u003c/strong>Responsible\u003cstrong> person can be chosen when the work is created; the shared Eric Queue is labelled as a list, not an assignment. \u003c/strong>The Monthly Budget Request\u003cstrong> replaces the planned Accounting item: it suggests a line for each active project below zero from the same balance the Projects page shows, lets leadership edit lines and paying entities, adds a contingency that never counts itself, shows totals by paying entity, saves drafts and produces a one-page PDF in the company's branding — \u003c/strong>a request only; nothing is funded, sent or approved by it.\u003cstrong> Access to it is its own permission, held by leadership and finance roles; Avah receives it when she asks and Nick approves. \u003c/strong>People:\u003cstrong> Chance and John accepted their invitations and set up their second factor themselves; Nick is preparing Jess's invitation. Eric's own phone check is still to come. \u003c/strong>The independent security review is deferred by Nick for a few weeks and is still required.\u003c/p>"},{"date":"2026-09-25","label":"September 25","html":"\u003cp>Fourteen small releases reached Production, each checked before release.\u003cstrong> John's workspace works well on his phone, with New Work Order, New Maintenance Request and Dispatch at the top; every workspace frame holds its own create button and view choice; Bank Transactions opens in the easier Record view on phones, names rows by their store, and sorts across every transaction; Tenant Ledger, Leases, Reimbursements and Reports are easier to scan, and lists no longer stop at 1,000 rows. \u003c/strong>Administrators can now review one person's activity\u003cstrong> — their changes kept permanently, and the pages and records they opened kept for 60 days — and every such review is itself recorded; Settings tells staff what is kept. The app icon was rebuilt from the original artwork. \u003c/strong>People:\u003cstrong> Nick reviewed and liked \u003c/strong>Chance's Workspace\u003cstrong> and invited Chance as a Platform Administrator (Director of Systems &amp; Analysis); he signs in and sets up his second factor himself. Patron access is separate from QuickBooks access. Eric's own phone check is still to come, and Nick invites John himself. \u003c/strong>The independent security review is deferred by Nick for a few weeks and is still required.\u003c/p>"},{"date":"2026-09-24","label":"September 24","html":"\u003cp>Bank Transactions is easier to read and to work in.\u003cstrong> Three small releases reached Production, each checked before release: vendor and property choices that filter as you type when recording a transaction; one compact filter bar with removable filter chips, the match count and total beside them; each row named by its vendor or its own memo rather than a repeated &quot;entity &gt; classification&quot;; short dates; a one-click copy of the entity and classification for Mercury; receipt shown as Uploaded or No receipt from the recorded status; and the property shown once. Nothing about the amounts, totals or records changed. \u003c/strong>People:\u003cstrong> Nick invites John himself when he is in the office next week; Jess follows once her workspace is ready; Eric's own phone check is still to come. \u003c/strong>The independent security review is deferred by Nick for a few weeks and is still required.\u003cstrong> Separately, \u003c/strong>the company's new public website went live at thepatrongrp.com, approved by Chance; it is a public site with no connection to the Patron Platform.\u003c/p>\n\u003cp>\u003cstrong>Publication:\u003c/strong> v1.22 is published to the same artifact; the share link follows the published version.\u003c/p>"},{"date":"2026-09-23","label":"September 23","html":"\u003cp>POCC has moved into Patron — Patron is now the company's system of record.\u003cstrong> The command center's work orders and their checklists, project tracking, bank transactions and the September reserve and funding records were imported into Patron and reconciled, and new updates now go to Patron. \u003c/strong>POCC Web shows an archive notice that points people to Patron, and the Google Sheet is kept as read-only history.\u003cstrong> Avah's operational access was turned on the same afternoon. \u003c/strong>Eric joined as Field Lead:\u003cstrong> he sees all work orders and maintenance requests and updates only the work assigned to him; his fourteen queued jobs were matched one by one against the archived Sheet and assigned to him, and he signed in with his own password and second factor. \u003c/strong>His own check on his phone is still to come.\u003cstrong> Sixteen small releases reached Production the same day, each checked before release: rent due on each lease's own day, live management reports with a published occupancy rate, a full-access Leadership role for John and Jess (invitations wait on their confirmed addresses), editing a job's checklist after it is created, accurate Dispatch and Attention counts, and property lists that can be searched by typing. \u003c/strong>No independent security review has happened yet.\u003c/p>"},{"date":"2026-09-22","label":"September 22","html":"\u003cp>Avah is onboarded and using the Patron app for her daily residential work\u003cstrong> — the first person other than Nick working in it for real. Nick's own workspace was assigned first; Avah then signed in on her own device with her own password and second factor, and she and Nick checked her workspace, menu and permissions together with nothing confusing reported. \u003c/strong>She has entered the first real tenant, lease, charge, payment and deposit records.\u003cstrong> Ten small releases reached Production the same day, each checked before release and each fixing something she met while working: tenant search, deposits on tenant pages, tenant contact details and editing, payments and credit that can be applied to any tenant charge (with a duplicate-charge warning and a recorded way to cancel a charge created in error), accurate lease endings, rent summaries on the Leases and Tenants pages, and day counts that use today's date. \u003c/strong>Next: moving POCC into Patron\u003cstrong> — work orders, project tracking, maintenance requests and bank transactions — this week if time permits, otherwise next week, planned step by step for Nick's go. POCC Web and the Google Sheet stay the place of record for those until each area moves. \u003c/strong>No independent security review has happened yet.\u003c/p>\n\u003cp>\u003cstrong>Publication:\u003c/strong> v1.20 was published to the same artifact as Version 21 (2026-09-22).\u003c/p>"},{"date":"2026-09-21","label":"September 21","html":"\u003cp>The release is live in Production.\u003cstrong> With Nick's approval, the personal home workspaces, \u003c/strong>My Access\u003cstrong> requests with administrator decisions, sessions ended on deactivation, and one shared definition of access were released after the two final checks passed. The same day brought practical improvements: \u003c/strong>signed lease files\u003cstrong> can now be stored privately with each lease (or linked from Google Drive), and a lease cannot be activated without one; Slack, Trello and Google Calendar open the real services from the platform; Settings no longer show switches that do nothing; the side menu can be resized; and all but one property now has its city. \u003c/strong>Tenant maintenance requests\u003cstrong> now have a public request page and a phone and text line, reviewed by a person before anything is recorded — POCC Web and the Google Sheet stay the place of record for maintenance until the planned switch with John. \u003c/strong>Avah's start is prepared and rehearsed\u003cstrong> on the development platform; she has not been invited, and her invitation happens only with Nick present and his separate go. \u003c/strong>No independent security review has happened yet.\u003c/p>"},{"date":"2026-09-18","label":"September 18 (end of week)","html":"\u003cp>The next release is prepared and tested, but not approved — Production did not change this afternoon.\u003cstrong> It adds four things, all built and checked on the development platform: a \u003c/strong>personal home workspace\u003cstrong> for each person, which decides where they land and never what they can reach; \u003c/strong>My Access\u003cstrong>, where an employee sees which areas they do not have — by name and purpose only — and can ask for one with a business reason, while an administrator approves it for a set period or permanently, or declines, always with a reason, and temporary access ends by itself; \u003c/strong>deactivating someone now also ends every session they have open\u003cstrong>; and one shared definition of access, so the menu, each page and the database always give the same answer. Testing it with a test employee account found real problems — reports offered to people who did not have them, report pages showing sample figures, and an approval that the screens did not recognise — and each was fixed and re-tested before anything moves. The \u003c/strong>Security &amp; Trust\u003cstrong> page was rewritten from checked facts and states plainly what is still missing, including that \u003c/strong>no independent security review has happened\u003cstrong>. \u003c/strong>Two final checks come first on Monday:\u003cstrong> confirming how Production's database would be recovered (daily backups exist; point-in-time recovery is not enabled), and one more check of the Security &amp; Trust page as an ordinary employee — then Nick decides. \u003c/strong>Gmail is connected for Dispatch in Production;\u003cstrong> the first real draft waits for Nick's go. \u003c/strong>Avah's start is planned for Tuesday, September 22, after the release and with Nick present; she has not been invited and none of her information has been entered. POCC Web and the Google Sheet remain authoritative for operations.\u003c/p>\n\u003cp>\u003cstrong>Publication:\u003c/strong> v1.19 was published to the same artifact as Version 20 (2026-09-21).\u003c/p>"},{"date":"2026-09-18","label":"the morning of September 18","html":"\u003cp>Administrators can now choose, person by person, which parts of the Patron Platform someone can reach\u003cstrong> — seven areas named in the business's own words: Residential; Work Orders, Maintenance &amp; Vendors; Dispatch; Finance; Reports; Master Data &amp; Imports; Administration. Choosing areas can never give someone more than their role allows, and the platform's database — not just the screens — refuses anything outside a person's areas. This is \u003c/strong>live in Production\u003cstrong> since September 18, released with Nick's approval after testing on the development platform and a fresh check of Production; the company's records were unchanged by the update, and Nick confirmed it working after signing in. It is the control Avah's residential-only start relies on. Nothing else changed: POCC Web and the Google Sheet remain authoritative for operations, no real residential records have been entered yet, and the \u003c/strong>independent security review still has not happened — the platform is not described as independently reviewed.\u003c/p>\n\u003cp>\u003cstrong>Publication:\u003c/strong> v1.17 was published to the same artifact as Version 18 (2026-09-18).\u003c/p>"},{"date":"2026-09-17","label":"September 17","html":"\u003cp>The Patron Platform is now live in Production for internal office use, at the company's own address, released today after a rehearsal on a copy of real data. Employees sign in with a password and a second factor, and the platform itself now requires that second factor before any information can be reached — a weakness found by our own review before release, and fixed. Nick performed every protected step of the release and checked afterwards that signing in, resetting a password by email and receiving an alert all work.\u003c/p>\n\u003cp>\u003cstrong>What this does and does not mean.\u003c/strong> POCC Web and the Google Sheet remain the authoritative systems for operational work; that changes only at the later cutover with John. \u003cstrong>No tenant or customer has access, and no real residential records have been entered yet.\u003c/strong> Avah begins next week with residential work only, guided, with Nick present and opening balances entered by him; nothing is guessed, and her own acceptance is what closes it.\u003c/p>\n\u003cp>\u003cstrong>Still open and stated plainly.\u003c/strong> The \u003cstrong>independent security review has not happened yet\u003c/strong> — by Nick's decision it follows this internal release rather than blocking it, is scheduled when John returns, and its findings will be fixed and retested. This release is therefore \u003cstrong>not described as independently reviewed\u003c/strong>. Backups run once a day with no point-in-time recovery, and uploaded documents have no backup yet, so documents are not relied on until that is decided with Jess.\u003c/p>\n\u003cp>\u003cstrong>Publication:\u003c/strong> v1.16 was published to the same artifact as Version 17 (2026-09-17).\u003c/p>"},{"date":"2026-09-16","label":"September 16 (end of day)","html":"\u003cp>Payments and email are now accepted by Nick on the development platform. Rent credit is shown to the cent and can only be applied to the same tenant's charges; invitation, password-reset and failure-alert emails passed live tests, including two problems found and fixed along the way. The release is now planned as \u003cstrong>two milestones\u003c/strong>: first, the existing app changes in Production and Avah's residential work, while POCC Web and the Google Sheet stay authoritative for operations; second, the POCC cutover with John. To make the first milestone safe, \u003cstrong>a new account can start residential-only\u003c/strong>: operational access is held back by the server and is turned on only by an administrator using two-factor sign-in, a written reason and an audit record, and an ordinary access request cannot get around it. This is built and tested on the development platform; the final browser test with a test coordinator account is scheduled for the next working day. An \u003cstrong>independent security review is required before Production use\u003c/strong> and is not yet engaged or scheduled. Decisions on point-in-time database recovery and a nightly backup of uploaded files are with Nick, Jess and the owner; nothing is enabled. The week of September 21 remains a \u003cstrong>target, not a confirmed release date\u003c/strong>; John remains targeted for the week of September 28. Nothing has changed in Production.\u003c/p>\n\u003cp>\u003cstrong>Publication:\u003c/strong> v1.15 is published to the same artifact as Version 16 (2026-09-16). The share link keeps serving Version 15 (v1.14) until Nick selects \u003cstrong>Version 16\u003c/strong> under \u003cem>Shared version\u003c/em>.\u003c/p>"},{"date":"2026-09-15","label":"September 15 (evening)","html":"\u003cp>The corrections a real residential cutover needs first are built and verified on the development platform — nothing moved to Production.\u003cstrong> A rent payment entered in error can now be \u003c/strong>reversed rather than deleted\u003cstrong>: it stays in the history with its reason, the months it paid reopen, and nothing implies money was refunded. A lease's start date or type can be \u003c/strong>corrected before any rent is charged\u003cstrong>. Both were checked in the browser, which found and fixed an amount-entry problem that had recorded \u003c/strong>an amount several thousand times too large\u003cstrong> — the form now shows exactly what it will record before saving. Nick clarified that \u003c/strong>Avah will work across company-wide operations\u003cstrong>, so her existing Operations Coordinator role fits, and \u003c/strong>recording deposits\u003cstrong> was added to it on the development platform; refunds, approvals and administration stay out. A one-time load of the POCC workbook's financial position and work orders was prepared and proven on test records, and the Production cutover is written as one ordered checklist — \u003c/strong>neither has been run. Lease correction is accepted; credit-fix browser verification and Nick's payment retest come next.\u003c/p>"},{"date":"2026-09-15","label":"v1.13 (2026-09-15, morning)","html":"\u003cp>No new capability — the next goal, and a currentness repair.\u003cstrong> Nick has set readiness targets: \u003c/strong>Avah's first guided use of Patron the week of September 21, and John's the week of September 28\u003cstrong>, when he returns. They are targets for being ready, not launch dates: email must be connected and accepted first, each person accepts the system on their own device, and nothing moves to Production and no real residential record is imported without its own approval. \u003c/strong>John's existing POCC Web access and his future Patron account are separate milestones.\u003cstrong> This version also corrects statements that had gone stale — travel dates that have passed, the backup-restore rehearsal described in one place as passed and in another as pending, and residential features listed as future work that are already built on the development platform. \u003c/strong>From today this binder is reviewed and published every workday, showing when it was last reviewed separately from when it last materially changed.\u003c/p>"},{"date":"2026-09-14","label":"v1.12 (2026-09-14)","html":"\u003cp>Two launch-readiness items are finished and accepted by Nick; a third is built but not yet switched on — all on the development environment only.\u003cstrong> A departing employee's account can now be \u003c/strong>deactivated, never deleted\u003cstrong>: their access ends at once while everything they did stays attributed to them, and Nick tested it end to end with a test account and accepted it. Patron can now be \u003c/strong>installed on a phone\u003cstrong> like an app, deliberately without an offline mode that could show stale records; Nick installed it on his Android phone, two layout problems he found were fixed, and he accepted it. \u003c/strong>Transactional email\u003cstrong> — invitations that actually reach the person, and failure alerts that reach someone who isn't looking at the screen — is \u003c/strong>built but not yet connected to an email service, and has sent nothing. The platform will not describe an email as delivered when it only knows it was handed over, and a link in an email is used only when a person presses the button.\u003c/p>\n\u003cp>\u003cstrong>Nothing is deployed, in business use, or promoted beyond the development environment\u003c/strong>, and no real employee has been invited. The remaining launch-readiness items are the email setup and its acceptance, a real backup restore, correcting known data gaps, and Avah's real residential onboarding.\u003c/p>"},{"date":"2026-09-11","label":"v1.11 (2026-09-11)","html":"\u003cp>The platform became something an employee could run a day inside — on a development database only.\u003cstrong> Over the week of September 8–11 the Patron Platform moved from a well-organized set of records to a working system: work orders open in a single view showing the job, its checklist, its photos and its history together; the person responsible is notified when something becomes theirs and can be mentioned by name; a dispatch package is prepared from selected work and handed to Gmail to send; each finance page answers one question and its ledger records who entered every line; and monthly rent is now produced \u003c/strong>automatically\u003cstrong>, correctly prorated when someone moves in or out part-way through a month, with an explicit move-out and vacancy process. Nick reviewed the interface three times during the week and accepted it. \u003c/strong>None of this is deployed, in business use, or promoted beyond the development environment.\u003c/p>\n\u003cp>\u003cstrong>The residential work is proven against test records, not real tenants.\u003c/strong> Tenant, lease, rent and deposit data is still deliberately held. Residential does not move over until Avah's \u003cstrong>real rent tracker is reviewed with her\u003c/strong> and migrated — that review is also where late-fee practice, deposits and any workflow the platform does not yet represent get settled. \u003cstrong>No residential record is invented in the meantime.\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Nine launch decisions were settled on 2026-09-11, and several are leadership-facing.\u003c/strong> The company will cut over \u003cstrong>one area at a time\u003c/strong> — latest source, import, reconcile, a named switch-over time, after which the old source becomes reference-only for that area — with \u003cstrong>no indefinite period of two systems both claiming to be the truth\u003c/strong>. \u003cstrong>Nick decides a rollback\u003c/strong>, triggered by the system reporting writes at risk for more than a business hour or by confirmed data loss. \u003cstrong>Chance and Jess\u003c/strong> provide emergency support so the company is not operationally dependent on Nick being reachable — which is deliberately \u003cem>not\u003c/em> the same as giving them unrestricted access to the application. Archived documents and photos are \u003cstrong>kept indefinitely\u003c/strong> for now. And a departing employee's account is \u003cstrong>deactivated, never deleted\u003c/strong>: their access ends, while everything they created, edited, commented on and were responsible for stays truthfully attributed to them.\u003c/p>\n\u003cp>\u003cstrong>What has actually been proven about POCC Web is unchanged from v1.10\u003c/strong>, and is restated below rather than upgraded: the checklist save path is verified live; work-order creation and editing and maintenance-request creation are switched on but not yet exercised live; bank-transaction creation and its duplicate safeguard are proven in testing but have never run against the live financial record. \u003cstrong>John has still not opened it under his own account\u003c/strong>, so &quot;delivered&quot; is not yet &quot;adopted.&quot;\u003c/p>"},{"date":"2026-09-05","label":"v1.10 (2026-09-05)","html":"\u003cp>The operations interface is live and in use on real records.\u003cstrong> POCC Web — the browser interface over the operations command center — runs at a permanent web address, shows the company's real operational and financial picture to authorized Patron users signed in with their own accounts, and \u003c/strong>can now save changes to the real workbook. Project budget cards, a work queue and a tenant-maintenance list that both correctly exclude finished work, and checklist progress.\u003c/p>\n\u003cp>\u003cstrong>The platform holds real company data.\u003c/strong> Organizations, properties and units are imported into the governed Production database and independently reconciled — through the platform's own secure, permission-checked path, by a real signed-in administrator using two-factor authentication. No back door, no direct database editing. Production is \u003cstrong>hard-locked to live data only\u003c/strong>, so an empty screen reads as honestly empty rather than quietly showing invented records. \u003cstrong>Real tenant, lease and rent data is deliberately still held\u003c/strong> until the residential readiness gate is green. QuickBooks remains the company's accounting system of record.\u003c/p>\n\u003cp>\u003cstrong>What has actually been proven, stated exactly.\u003c/strong> Ticking off a checklist item is \u003cstrong>verified against the live workbook\u003c/strong>. Creating and editing work orders, and raising maintenance requests, are \u003cstrong>switched on but not yet exercised live\u003c/strong>. Entering a bank transaction — and the safeguard that stops the same expense being recorded twice — is \u003cstrong>switched on and proven in testing, but has never run against the live financial record\u003c/strong>; it gets confirmed at the \u003cstrong>next genuine financial entry\u003c/strong>, never by inventing or duplicating one.\u003c/p>\n\u003cp>\u003cstrong>Three things worth knowing as the owner.\u003c/strong> Saving was switched on for \u003cstrong>everyone with existing edit access who can open the app\u003c/strong>, not for Nick alone — there is no per-person switch, and describing it otherwise would be a false reassurance. \u003cstrong>John has not yet opened it under his own account\u003c/strong>, so &quot;delivered&quot; is not yet &quot;adopted&quot;; he and Jess travel on \u003cstrong>September 11\u003c/strong>. And \u003cstrong>which work comes next has not been decided\u003c/strong> — a bounded improvement to Eric's field worksheets, or continuing Patron App development; both are under consideration and neither has started.\u003c/p>\n\u003cp>\u003cem>(A phone briefly appeared to show the desktop layout. The cause was \u003cstrong>Chrome's &quot;Desktop site&quot; setting\u003c/strong> being switched on; turning it off displayed the mobile layout correctly. A browser setting, not a fault in the software, and no change was needed.)\u003c/em>\u003c/p>\n\u003cp>\u003cstrong>How the interface reached this point — the short version, because the order was the safeguard.\u003c/strong> It was first placed in front of the real workbook \u003cstrong>unable to change anything\u003c/strong>, verified, and left that way for several hours. Saving was then switched on as its own separate decision, and a \u003cstrong>read-only version was built and set aside beforehand\u003c/strong>, so stepping back is a prepared move rather than an emergency change. The first real save was \u003cstrong>a genuinely completed checklist item on a real work order\u003c/strong> — confirmed, still correct after a refresh, matched in the workbook, and \u003cstrong>kept\u003c/strong>. A proposed alternative, creating a fake work order and deleting it, was \u003cstrong>rejected\u003c/strong>: putting something untrue into the operational record and then editing the record to hide it proves less and leaves a falsehood behind.\u003c/p>"}],"eras":[{"era":"Foundation","period":"Late June 2026","text":"Project Atlas began as a way for Nick to learn how The Patron Group operates and turn that learning into durable, reviewable company memory. The first work built the repository memory and knowledge system, a company-language glossary to reconcile terms across Zoho and QuickBooks, and an initial understanding of the people (John, Riley, Chance) and the multi-entity structure the company runs on."},{"era":"The Command Center Takes Shape","period":"Early July 2026","text":"The Patron Operations Command Center (POCC) was named as Atlas's primary application layer. Sprints 1 and 1.5 delivered the core operational workbook and its executive polish; the Dashboard was reframed as executive attention management; and the Operational Alerts Framework produced its first validated alert (a W-9 payment hold). A permanent UX standard was adopted, the executive publishing pipeline went live, and the Work Impact reporting became an evidence-based system that only claims what it can defend."},{"era":"An Operational Finance Platform","period":"July 8–9, 2026","text":"POCC's financial source-of-truth was finalized (Projects own budgets, Bank Transactions own financial events, Work Orders own operations), and the Reserve Funds subsystem and Portfolio Improvement Report v1 were built — the COO reviewed both very positively. Atlas Milestone #001 marked POCC MVP feature-complete and entering Production Hardening, and its durable product foundation was set: a Constitution, documentation hierarchy, engineering and implementation standards, and expanded design principles. A leadership meeting scheduled the production transition, prioritized capturing a departing team member's institutional knowledge, and reframed Atlas as the company's operating system and institutional-knowledge platform."},{"era":"Validation & the Operations Intelligence Platform","period":"July 10, 2026","text":"POCC entered a Validation & Quality Assurance stage — proving reliability before shipping more, using a regression checklist run before any module is production-ready and after any large import (the first stress test caught and fixed a real issue before production). Atlas then completed a governed Reporting Platform (Milestone #002) and three governed intelligence engines — Property, Entity, and Vendor (Milestone #003) — becoming an Operations Intelligence Platform (Milestone #004). Report generation became the first capability with a clear before-and-after labor baseline: a comparable six-month operational report went from about 16 hours of manual reconciliation to seconds-to-minutes — an initial estimated direct-labor saving of about $480 per comparable report at $30/hour (one observed baseline, not cumulative realized savings). Other value (less leadership interruption, fewer errors, faster decisions) is tracked separately, without dollar figures, until evidence exists."},{"era":"Production Candidate & Operating the Business","period":"July 13–14, 2026","text":"POCC reached its first Production Candidate (RC1, Milestone #005) and entered Operational Validation — the business is now run through POCC on real Patron Group data, with improvements emerging from real use. The Financial Ownership Model removed a duplicate financial section that risked double-counting, making Projects the single executive financial source while Work Orders stay operational and Bank Transactions stay accounting. Vendor Onboarding (Milestone #006) and Financial Data Population (Milestone #007) moved POCC from structural prototype toward a live operational system, and the Standard Operational Intake Workflow (Capture → interpret → implement) was adopted."},{"era":"Field Operations, Reporting & an Expanded Role","period":"July 15–16, 2026","text":"The Eric Field Work Queue began synchronizing automatically in both directions between the office and the field (Milestone #008), and a control-driven Reporting System, a Financial Reserve Calculator, and a Protection-by-Default engineering standard were added (Milestone #009). John then formally expanded Nick into a right-hand project decision partner, adopting the Project Options Standard / Three-Option Rule (bring two or three decision-ready options for meaningful decisions). Nick went hands-on with finance — learning the Mercury ACH payment workflow and processing vendor payments, reconciling a project budget with accounting, and helping reallocate approved project funds — and the long-term Property Development Pipeline vision was documented as a separate future module that will hand stabilized properties into POCC."},{"era":"The Patron Platform Reaches Production","period":"Late July – September 18, 2026","text":"The Patron Platform's foundation was completed in late July; a dedicated Production environment was created and security-validated in August and the company's master data was onboarded; POCC Web went live in Production on September 5; and on September 17 the Patron Platform was released to Production for internal office use, with per-person access areas the next day."},{"era":"Patron Becomes the System of Record","period":"September 22 – October 2, 2026","text":"Avah began her daily residential work in Patron on September 22; the command center's work moved into Patron on September 23; leadership joined between September 25 and 29; project balance warnings and database point-in-time recovery followed on October 1; and on October 2 recording refunds and the Reports page were released and this brief and the onboarding binder became one page."}],"milestones":[{"name":"Released: marking an older bank transaction reviewed — who, when, and whether reconciliation is still open — with no change to any money (Nick's approval, checked live). Decided (Owner Decisions): six older records stay as they are; projects count money only when it arrives; record views and exports are kept permanently.","date":"2026-10-04","mile":true},{"name":"Combined Executive Operations Brief adopted (Delivered). On Nick's publication GO the Brief and the Owner Onboarding Binder became one page at the main address, verified live; the separate binder page is kept as a superseded record.","date":"2026-10-02","mile":true},{"name":"Released: recording refunds, expenses that keep the entity they were recorded with, a W-9 report that never shows a false all-clear, and the Reports page with printable reports. Accepted (Owner Reports, Nick): his own refund recording; rent, deposits, Avah's records, the daily workflow and maintenance verified; every implemented workflow tested and working (his confirmation, not an independent test).","date":"2026-10-02","mile":true},{"name":"Released: project balance warnings, switched on with alerts to leadership; Production's database gained seven-day point-in-time recovery. Accepted (Owner Reports): Jess's first use and Eric's use.","date":"2026-10-01","mile":true},{"name":"Leadership onboarded (Accepted): Chance (September 25), John (September 28), Jess and Matt (September 29) each accepted their invitation and set up their own second factor.","date":"2026-09-29","mile":true},{"name":"Patron becomes the company's system of record (Released, Owner Decision). The command center's work orders, projects, bank transactions and reserve records moved into Patron and were reconciled; POCC Web and the Google Sheet are kept as read-only history.","date":"2026-09-23","mile":true},{"name":"First daily user (Accepted): Avah began her daily residential work in Patron and entered the first real tenant, lease, charge, payment and deposit records.","date":"2026-09-22","mile":true},{"name":"Patron Platform released to Production for internal office use (Released, Owner Decision) — named employees only, no tenant or customer access, before the independent security review, which is still required.","date":"2026-09-17","mile":true},{"name":"🏛️ POCC Web reaches Production and then begins changing it (Milestones #018 and #019). In one evening, three separate owner approvals closed in deliberate sequence. First, POCC Web went live in Production, unable to change anything — a standalone application in front of the company's real operating workbook, verified live: the real data loading, every create control visibly disabled, and an undismissable PRODUCTION · READ ONLY banner. It was given a permanent web address that survives every future update, making it the first Atlas-built application to run against the company's real production system of record. The full mobile and checklist-responsiveness release was built and shipped to that same address, still read-only. Then, as its own separate decision, saving was switched on — and the first save was a true operational update: one genuinely completed checklist item on a real work order, confirmed on screen, still correct after a refresh, matched in the workbook with the rest of the row untouched, and kept rather than undone. A planned alternative — creating a fake work order and deleting it — was rejected outright, because writing an untruth into the operational record and then editing the record to hide it proves less and leaves a falsehood behind. Stated precisely, because this is the claim most likely to grow in the retelling: the checklist save path is verified live; work-order create/edit and maintenance-request creation are switched on but not yet exercised live; and bank-transaction creation with its duplicate-entry safeguard is switched on and proven in testing but has never run against the live financial record — it is checked at the next genuine financial entry, never by inventing, duplicating, or double-entering one. Switching saving on applied to everyone with existing edit access who can open the app, not to Nick alone. A read-only version was built and set aside before saving was enabled, so reverting is a prepared step rather than an emergency edit. Still open and honestly stated: John has not yet opened it under his own account. (As recorded on the day, a phone-layout concern was also open here; it was resolved the same day — Chrome's Desktop site setting was on, and switching it displayed the mobile layout correctly. No application defect and no code change.) Deployment configuration and the built artifact are Verified; every live on-screen confirmation is owner-reported from his own session. No work order identifier, property, checklist wording, vendor, financial value, or screenshot from the live system was recorded anywhere. QuickBooks remains the accounting system of record; no time or dollar savings are claimed.","date":"2026-09-05","mile":true},{"name":"🏛️ Governed Production Environment Created & Security-Validated (Phase B1 — in progress). Patron Platform gained a dedicated Production database on Supabase Pro (hosting also upgraded to Pro), isolated from Dev and Staging. Human-operated and identity-verified first, the team applied the full migration chain (0001→0010, local == live), confirmed zero operational rows, seeded the authorization baseline once (6 roles, 35 capabilities, 127 mappings; offline parity + 144 negative checks + 24/24 hardening + 22/22 harness), and ran the complete security suite directly against Production — role/capability access, row-level security, scoped access, and trusted server-controlled paths all correct, with every test rolled back and no residue (all counts zero). Auth/session hardened (30-day/7-day limits, MFA, invitation-only, public and anonymous sign-ups disabled, email confirmation on) and Pro daily backups active. A restore-to-new-project rehearsal exercised the recovery mechanism (healthy scratch project created, then deleted). Phase B1 is NOT complete: the seeded-state recovery check has not yet passed (the rehearsal backup predated the migrations), so the real 12/40 Master Data import stays blocked pending the seeded-state restore rehearsal plus the app's Production deployment/config isolation and first-administrator bootstrap. No real company data entered Production; QuickBooks remains the accounting system of record. Human-operated and offline-authored; Verified in the repository; not merged to main; no real-data onboarding; no time or dollar savings are claimed.","date":"2026-08-11","mile":true},{"name":"Milestone #017 — Patron Platform V1 core demonstrated (Delivered, development only): one connected record per business item with all financials derived from one ledger, still in-memory and not production-capable at the time.","date":"2026-07-30","mile":true},{"name":"Milestone #016 — Patron Platform identity foundation live-validated (Delivered, development only): real sign-in with a required second factor, enforced by the server.","date":"2026-07-30","mile":true},{"name":"Milestone #015 — Patron Platform cloud preview and development-database foundation (Delivered, development only).","date":"2026-07-29","mile":true},{"name":"Milestone #013 — Work Order Dispatch Center version 1 (Delivered): a guided workflow that prepares professional work order packages, replacing a manual Word-and-email process.","date":"2026-07-24","mile":true},{"name":"Milestone #012 — Patron Platform architecture established (Decision): one unified internal operating platform as the long-term direction, after discovery with John and Jess.","date":"2026-07-23","mile":true},{"name":"Milestone #011 — First executive validation of the Executive Capture Pipeline (Accepted, Stakeholder Report): leadership reviewed and endorsed real output on a live project.","date":"2026-07-22","mile":true},{"name":"🏛️ Patron Platform Foundation v1.0 COMPLETE — the unified operating system's visual and technical foundation is established and independently recoverable. Delivered: a cohesive product identity and design system; desktop and mobile login experiences (a dedicated portrait mobile composition with corrected brand hierarchy — The Patron Group primary, Patron Platform subordinate — validated across phone sizes and desktop); a security baseline (0 known dependency vulnerabilities · conservative security headers · demo-authentication contained as development-only) with a production-security plan (real authentication is a pre-production hard gate); documented architecture and decisions; verified recovery tooling and a Foundation Recovery Snapshot v1.0 (checksum-verified, extracted, manually inspected, git-bundle-restore validated, and copied to an external drive); and a synchronized, pushed repository. The people-centered product principle was recorded (organize work around people, not software modules). The project now moves from foundation work into production-authentication architecture and real operational-workflow discovery (Christy's Dashboard · Avah's Workspace) — discovery and approval precede implementation. Software/design changes are Verified in the repository; no time or dollar savings are claimed.","date":"2026-07-28","mile":true},{"name":"Riley transition completed successfully + POCC operational rollout producing real workflow improvement. The Riley transition is complete — operational continuity was preserved, and the knowledge she held is now documented in POCC and shared across multiple employees (a successful transition, not merely an administrative close-out). Running the business through POCC is now producing real, stakeholder-reported improvement: multiple employees report smoother operations and satisfaction with the system, and financial documentation is much faster — Chance (accounting) notes bank-transaction notes/details and receipts now appear almost immediately rather than after weeks, improving accounting visibility. Stakeholder-reported/qualitative — tracked as evidence toward Verified Impact; no time or dollar savings claimed until a baseline is measured. Also this session (internal): Patron Platform Workspace hero branding polish (enlarged upper-right wordmark/tagline for readability) and ECP v4 Work Package documentation standards","date":"2026-07-28","mile":true},{"name":"Maintenance Intake System Complete (Milestone #010) — POCC's first native intake workflow, production-ready: tenant maintenance requests are created inside POCC through a guided modal that automatically generates a Work Order and surfaces it in a dashboard triage queue, replacing the customer-facing Google Form; validated end-to-end by retiring the one legacy manual request and recreating it through the new workflow. POCC then established a reusable guided-forms UI framework (a shared utility layer + a grouped Property Selector) and immediately reused it to build an Office Work Order intake module — the framework's first proof (built by reuse, validated with no regressions). New Design Principle #35 — guided forms are the primary interface; the spreadsheet is the database. AI continuity was also formalized as an Atlas subsystem (a canonical startup entry point + a synchronization architecture) so any AI assistant resumes the project reliably","date":"2026-07-21","mile":true},{"name":"POCC enters real-world daily use and Atlas becomes a multi-program platform. A live Work Orders review with John moved POCC from development into daily operational use. Maintenance intake direction resolved — Avah is the single intake owner (tenants don't self-submit), so a native POCC Maintenance Request dialog is the confirmed long-term direction; the Google Form becomes a prototype. New Design Principle #33 — POCC is the operational platform, not a workbook. New companion program Patron Operating Standards (POS) standardizes how the company operates. Work Orders matured into an executive workflow system (Status vs. Action Required; W-9 as an executive alert; Request Source; queue Top 20)","date":"2026-07-20","mile":true},{"name":"Nick's role formally expanded to right-hand project decision partner; the Project Options Standard / Three-Option Rule adopted as an Atlas operating standard. Hands-on operations: learned the Mercury ACH payment workflow and processed vendor payments; reconciled a project budget with accounting; helped reallocate approved project funds. The long-term Property Development Pipeline / Property Lifecycle Command Center vision documented (a separate future module handing stabilized properties into POCC). Executive Operations Brief redesigned (v3) and renamed","date":"2026-07-16","mile":true},{"name":"Field Operations, Financial Insight & Reporting System Implementation Day (Milestone #009) — Financial Reserve Calculator + control-driven reporting system (active validation) + Protection by Default standard","date":"2026-07-15","mile":true},{"name":"Eric Field Work Queue: Automated Two-Way Sync MVP Complete (Milestone #008) — POCC's first field-operations workflow, syncing automatically both directions with no manual effort
